il in each answer (another place, food or time) to make it your own."},{"id":"kanji","kind":"kanji","target":"review","upto":22,"icon":"🈶","minutes":2,"title":"Kanji review: all 69 kanji so far","why":"One quiz round over every kanji you have learned — the ones from earlier days come back."},{"id":"test","kind":"test","target":"final","icon":"👑","minutes":8,"title":"Final N5 grammar test","why":"20 questions from every level — the closest thing here to the real N5 grammar section."}]}],"planWhy":["Most of every day is speaking and reading: two dialogues (8 minutes) and three new kanji (4 minutes). A short grammar step (3 minutes) keeps you moving through the N5 grammar.","Dialogue 1 is today's conversation. Dialogue 2 is yesterday's one again — meeting it a second time the next day is what moves the answers into long-term memory.","The same five conversations come back every five days with a harder twist, so the answers become automatic — that is what the N5 listening part needs.","Kanji: 3 new ones on each lesson day, 69 by the end — the most common N5 kanji (numbers, days, time, people, places and everyday verbs). The quiz mixes in kanji from earlier days so they keep coming back.","Test days come right after each grammar level, together with a quiz over every kanji so far. Day 30 is the final 20-question test.","The ⏱ timer counts only while you are actively using a practice page (not the Home or Plan page), and it pauses after 2 minutes without a click or key press.","Tasks tick themselves off when you finish them (a dialogue where you answered at least half the lines yourself, a kanji quiz round, a test, or 3 minutes in the lesson). You can also tick them by hand."],"greet":["毎日十五分、日本語を勉強しましょう。","まいにち じゅうごふん、にほんごを べんきょう しましょう。","Mainichi juugofun, nihongo o benkyou shimashou.","Let's study Japanese for 15 minutes every day."],"welldone":["今日もお疲れさまでした。","きょうも おつかれさまでした。","Kyou mo otsukaresama deshita.","Great work again today."],"stickers":[["0","基","き","Foundations","#2fa84f"],["1","助","じょ","Particles","#16a085"],["2","動","どう","Verbs","#d9822b"],["3","形","けい","Adjectives","#c79100"],["4","願","ねがい","Requests & wishes","#c0392b"],["5","達","たつ","Advanced N5","#8e44ad"],["final","合格","ごうかく","N5 Grammar Master","#d4a017"]],"particleJobs":{"は":"は (read 'wa') marks the TOPIC — what the sentence is about.","が":"が marks WHO / WHAT does it — new information, after question words, and with 好き, ある, いる.","を":"を (read 'o') marks the OBJECT — what the action is done to.","に":"に marks a destination, an exact time, where something exists, or the person you meet or give to.","で":"で marks WHERE an action happens, or the MEANS / tool (by, with).","へ":"へ (read 'e') marks the direction — towards.","と":"と means 'and' (a complete list) or 'together with'.","の":"の links two nouns — the owner or description comes first.","も":"も means 'too / also' and replaces は, が or を.","から":"から means 'from' (a starting point).","まで":"まで means 'until' or 'as far as'.","や":"や lists examples: 'A, B and so on'."},"alsoOk":{"は":["が","も"],"が":["は","も"],"を":["は","も"],"に":["は","へ","も"],"へ":["に"],"と":["や"],"や":["と"],"も":["が","は","を"],"で":["は","も"],"の":[],"から":[],"まで":[]},"sentences":[{"cat":"Greetings","jp":"おはようございます。","kana":"おはよう ございます。","romaji":"Ohayou gozaimasu.","en":"Good morning.","note":"Polite greeting (morning)","opp":null},{"cat":"Greetings","jp":"こんにちは。","kana":"こんにちは。","romaji":"Konnichiwa.","en":"Hello. / Good afternoon.","note":"Daytime greeting","opp":null},{"cat":"Greetings","jp":"こんばんは。","kana":"こんばんは。","romaji":"Konbanwa.","en":"Good evening.","note":"Evening greeting","opp":null},{"cat":"Greetings","jp":"お元気ですか。","kana":"おげんき ですか。","romaji":"O-genki desu ka?","en":"How are you?","note":"か turns a sentence into a question","opp":null},{"cat":"Greetings","jp":"はい、元気です。","kana":"はい、げんき です。","romaji":"Hai, genki desu.","en":"Yes, I'm fine.","note":"な-adjective + です","opp":["いいえ、元気じゃないです。","いいえ、げんき じゃないです。","Iie, genki ja nai desu.","No, I'm not fine.","な-adjective: 元気です → 元気じゃないです"]},{"cat":"Greetings","jp":"ありがとうございます。","kana":"ありがとう ございます。","romaji":"Arigatou gozaimasu.","en":"Thank you very much.","note":"Polite thanks","opp":null},{"cat":"Greetings","jp":"すみません。","kana":"すみません。","romaji":"Sumimasen.","en":"Excuse me. / I'm sorry.","note":"Getting attention / apologizing","opp":null},{"cat":"Greetings","jp":"はじめまして。","kana":"はじめまして。","romaji":"Hajimemashite.","en":"Nice to meet you.","note":"Said when meeting someone for the first time","opp":null},{"cat":"Greetings","jp":"よろしくお願いします。","kana":"よろしく おねがいします。","romaji":"Yoroshiku onegaishimasu.","en":"Pleased to meet you. / I look forward to working with you.","note":"Set phrase","opp":null},{"cat":"Greetings","jp":"おやすみなさい。","kana":"おやすみなさい。","romaji":"Oyasuminasai.","en":"Good night.","note":"Said before going to bed","opp":null},{"cat":"Greetings","jp":"また明日。","kana":"また あした。","romaji":"Mata ashita.","en":"See you tomorrow.","note":"あした = tomorrow","opp":null},{"cat":"Greetings","jp":"さようなら。","kana":"さようなら。","romaji":"Sayounara.","en":"Goodbye.","note":"Farewell","opp":null},{"cat":"Self-introduction","jp":"私はアンッティです。","kana":"わたしは アンッティ です。","romaji":"Watashi wa Antti desu.","en":"I am Antti.","note":"X は Y です (X is Y)","opp":["私はアンッティじゃありません。","わたしは アンッティ じゃありません。","Watashi wa Antti ja arimasen.","I am not Antti.","Noun: です → じゃありません"]},{"cat":"Self-introduction","jp":"フィンランドから来ました。","kana":"フィンランドから きました。","romaji":"Finrando kara kimashita.","en":"I came from Finland.","note":"から = from; past tense ～ました","opp":["フィンランドから来ませんでした。","フィンランドから きませんでした。","Finrando kara kimasen deshita.","I didn't come from Finland.","Past: ました → ませんでした"]},{"cat":"Self-introduction","jp":"お名前は何ですか。","kana":"おなまえは なん ですか。","romaji":"O-namae wa nan desu ka?","en":"What is your name?","note":"なん = what","opp":null},{"cat":"Self-introduction","jp":"日本語を勉強しています。","kana":"にほんごを べんきょう しています。","romaji":"Nihongo o benkyou shite imasu.","en":"I am studying Japanese.","note":"～ています = ongoing action","opp":["日本語を勉強していません。","にほんごを べんきょう していません。","Nihongo o benkyou shite imasen.","I'm not studying Japanese.","～ています → ～ていません"]},{"cat":"Self-introduction","jp":"ヘルシンキに住んでいます。","kana":"ヘルシンキに すんでいます。","romaji":"Herushinki ni sunde imasu.","en":"I live in Helsinki.","note":"に すんでいます = live in","opp":["ヘルシンキに住んでいません。","ヘルシンキに すんでいません。","Herushinki ni sunde imasen.","I don't live in Helsinki.","～ています → ～ていません"]},{"cat":"Self-introduction","jp":"どこに住んでいますか。","kana":"どこに すんでいますか。","romaji":"Doko ni sunde imasu ka?","en":"Where do you live?","note":"どこ = where","opp":null},{"cat":"Self-introduction","jp":"趣味はゲームです。","kana":"しゅみは ゲーム です。","romaji":"Shumi wa geemu desu.","en":"My hobby is games.","note":"Katakana loanword: ゲーム","opp":["趣味はゲームじゃありません。","しゅみは ゲーム じゃありません。","Shumi wa geemu ja arimasen.","My hobby isn't games.","Noun: です → じゃありません"]},{"cat":"Self-introduction","jp":"コーヒーが好きです。","kana":"コーヒーが すき です。","romaji":"Koohii ga suki desu.","en":"I like coffee.","note":"～が すきです = like","opp":["コーヒーが好きじゃありません。","コーヒーが すき じゃありません。","Koohii ga suki ja arimasen.","I don't like coffee.","な-adjective: 好きです → 好きじゃありません"]},{"cat":"Self-introduction","jp":"何歳ですか。","kana":"なんさい ですか。","romaji":"Nansai desu ka?","en":"How old are you?","note":"なんさい = how old","opp":null},{"cat":"Restaurant","jp":"メニューをください。","kana":"メニューを ください。","romaji":"Menyuu o kudasai.","en":"The menu, please.","note":"～を ください = please give me","opp":null},{"cat":"Restaurant","jp":"水をください。","kana":"みずを ください。","romaji":"Mizu o kudasai.","en":"Water, please.","note":"を marks the object","opp":null},{"cat":"Restaurant","jp":"ビールを二つください。","kana":"ビールを ふたつ ください。","romaji":"Biiru o futatsu kudasai.","en":"Two beers, please.","note":"Counter ～つ (ひとつ, ふたつ…)","opp":null},{"cat":"Restaurant","jp":"いただきます。","kana":"いただきます。","romaji":"Itadakimasu.","en":"Thank you for the food. (before eating)","note":"Said before a meal","opp":null},{"cat":"Restaurant","jp":"これはおいしいです。","kana":"これは おいしい です。","romaji":"Kore wa oishii desu.","en":"This is delicious.","note":"い-adjective + です","opp":["これはおいしくないです。","これは おいしく ないです。","Kore wa oishiku nai desu.","This isn't delicious.","い-adjective: おいしい → おいしくない"]},{"cat":"Restaurant","jp":"肉は食べません。","kana":"にくは たべません。","romaji":"Niku wa tabemasen.","en":"I don't eat meat.","note":"Negative ～ません","opp":["肉は食べます。","にくは たべます。","Niku wa tabemasu.","I eat meat.","Verb: 食べません → 食べます"]},{"cat":"Restaurant","jp":"ごちそうさまでした。","kana":"ごちそうさま でした。","romaji":"Gochisousama deshita.","en":"Thank you for the meal. (after eating)","note":"Past でした","opp":null},{"cat":"Restaurant","jp":"お会計をお願いします。","kana":"おかいけいを おねがいします。","romaji":"O-kaikei o onegaishimasu.","en":"The bill, please.","note":"～を おねがいします = polite request","opp":null},{"cat":"Shopping","jp":"これはいくらですか。","kana":"これは いくら ですか。","romaji":"Kore wa ikura desu ka?","en":"How much is this?","note":"これ = this; いくら = how much","opp":null},{"cat":"Shopping","jp":"それをください。","kana":"それを ください。","romaji":"Sore o kudasai.","en":"That one, please.","note":"それ = that (near you)","opp":null},{"cat":"Shopping","jp":"このシャツをください。","kana":"この シャツを ください。","romaji":"Kono shatsu o kudasai.","en":"This shirt, please.","note":"この + noun","opp":null},{"cat":"Shopping","jp":"もっと安いのはありますか。","kana":"もっと やすいのは ありますか。","romaji":"Motto yasui no wa arimasu ka?","en":"Is there a cheaper one?","note":"あります = there is (things)","opp":null},{"cat":"Shopping","jp":"カードでいいですか。","kana":"カードで いい ですか。","romaji":"Kaado de ii desu ka?","en":"Is it OK to pay by card?","note":"で = by means of","opp":null},{"cat":"Shopping","jp":"袋はいりません。","kana":"ふくろは いりません。","romaji":"Fukuro wa irimasen.","en":"I don't need a bag.","note":"いりません = don't need","opp":["袋はいります。","ふくろは いります。","Fukuro wa irimasu.","I need a bag.","Verb: いりません → いります"]},{"cat":"Shopping","jp":"スーパーで買い物をします。","kana":"スーパーで かいものを します。","romaji":"Suupaa de kaimono o shimasu.","en":"I go shopping at the supermarket.","note":"で = place of action","opp":["スーパーで買い物をしません。","スーパーで かいものを しません。","Suupaa de kaimono o shimasen.","I don't go shopping at the supermarket.","Verb: します → しません"]},{"cat":"Directions","jp":"トイレはどこですか。","kana":"トイレは どこ ですか。","romaji":"Toire wa doko desu ka?","en":"Where is the toilet?","note":"Katakana: トイレ","opp":null},{"cat":"Directions","jp":"駅はどこですか。","kana":"えきは どこ ですか。","romaji":"Eki wa doko desu ka?","en":"Where is the station?","note":"えき = station","opp":null},{"cat":"Directions","jp":"まっすぐ行ってください。","kana":"まっすぐ いって ください。","romaji":"Massugu itte kudasai.","en":"Please go straight.","note":"て-form + ください","opp":null},{"cat":"Directions","jp":"右に曲がってください。","kana":"みぎに まがって ください。","romaji":"Migi ni magatte kudasai.","en":"Please turn right.","note":"みぎ = right, ひだり = left","opp":null},{"cat":"Directions","jp":"左にあります。","kana":"ひだりに あります。","romaji":"Hidari ni arimasu.","en":"It's on the left.","note":"に あります = is located at","opp":["左にありません。","ひだりに ありません。","Hidari ni arimasen.","It isn't on the left.","あります → ありません"]},{"cat":"Directions","jp":"近いですか。","kana":"ちかい ですか。","romaji":"Chikai desu ka?","en":"Is it near?","note":"ちかい ⇔ とおい (near ⇔ far)","opp":null},{"cat":"Directions","jp":"タクシーで行きます。","kana":"タクシーで いきます。","romaji":"Takushii de ikimasu.","en":"I'll go by taxi.","note":"で = by (transport)","opp":["タクシーで行きません。","タクシーで いきません。","Takushii de ikimasen.","I won't go by taxi.","Verb: 行きます → 行きません"]},{"cat":"Directions","jp":"バスは何時に来ますか。","kana":"バスは なんじに きますか。","romaji":"Basu wa nanji ni kimasu ka?","en":"What time does the bus come?","note":"なんじ = what time","opp":null},{"cat":"Time & days","jp":"今何時ですか。","kana":"いま なんじ ですか。","romaji":"Ima nanji desu ka?","en":"What time is it now?","note":"いま = now","opp":null},{"cat":"Time & days","jp":"午前9時です。","kana":"ごぜん くじ です。","romaji":"Gozen kuji desu.","en":"It's 9 a.m.","note":"ごぜん = a.m., ごご = p.m.","opp":null},{"cat":"Time & days","jp":"今日は何曜日ですか。","kana":"きょうは なんようび ですか。","romaji":"Kyou wa nan'youbi desu ka?","en":"What day is it today?","note":"ようび = day of the week","opp":null},{"cat":"Time & days","jp":"今日は金曜日です。","kana":"きょうは きんようび です。","romaji":"Kyou wa kin'youbi desu.","en":"Today is Friday.","note":"きんようび = Friday","opp":["今日は金曜日じゃありません。","きょうは きんようび じゃありません。","Kyou wa kin'youbi ja arimasen.","Today isn't Friday.","Noun: です → じゃありません"]},{"cat":"Time & days","jp":"明日友達に会います。","kana":"あした ともだちに あいます。","romaji":"Ashita tomodachi ni aimasu.","en":"I will meet a friend tomorrow.","note":"～に あいます = meet someone","opp":["明日友達に会いません。","あした ともだちに あいません。","Ashita tomodachi ni aimasen.","I won't meet a friend tomorrow.","Verb: 会います → 会いません"]},{"cat":"Time & days","jp":"昨日映画を見ました。","kana":"きのう えいがを みました。","romaji":"Kinou eiga o mimashita.","en":"I watched a movie yesterday.","note":"Past ～ました","opp":["昨日映画を見ませんでした。","きのう えいがを みませんでした。","Kinou eiga o mimasen deshita.","I didn't watch a movie yesterday.","Past: 見ました → 見ませんでした"]},{"cat":"Daily routine","jp":"毎朝7時に起きます。","kana":"まいあさ しちじに おきます。","romaji":"Maiasa shichiji ni okimasu.","en":"I get up at 7 every morning.","note":"Time + に","opp":["毎朝7時に起きません。","まいあさ しちじに おきません。","Maiasa shichiji ni okimasen.","I don't get up at 7 every morning.","Verb: 起きます → 起きません"]},{"cat":"Daily routine","jp":"朝ご飯にパンを食べます。","kana":"あさごはんに パンを たべます。","romaji":"Asagohan ni pan o tabemasu.","en":"I eat bread for breakfast.","note":"Katakana: パン","opp":["朝ご飯にパンを食べません。","あさごはんに パンを たべません。","Asagohan ni pan o tabemasen.","I don't eat bread for breakfast.","Verb: 食べます → 食べません"]},{"cat":"Daily routine","jp":"シャワーを浴びます。","kana":"シャワーを あびます。","romaji":"Shawaa o abimasu.","en":"I take a shower.","note":"Katakana: シャワー","opp":["シャワーを浴びません。","シャワーを あびません。","Shawaa o abimasen.","I don't take a shower.","Verb: 浴びます → 浴びません"]},{"cat":"Daily routine","jp":"電車で会社に行きます。","kana":"でんしゃで かいしゃに いきます。","romaji":"Densha de kaisha ni ikimasu.","en":"I go to the office by train.","note":"に = destination","opp":["電車で会社に行きません。","でんしゃで かいしゃに いきません。","Densha de kaisha ni ikimasen.","I don't go to the office by train.","Verb: 行きます → 行きません"]},{"cat" <script>
"use strict";

  while (i < kana.length) {
    if (kana[i] === "っ" && i + 1 < kana.length) { const n = KR[kana.slice(i+1,i+3)] || KR[kana[i+1]] || ""; out += n[0] || ""; i++; continue; }

/* ---------- speech (iPhone's built-in Japanese voice) ---------- */
let jaVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    jaVoice = vs.find(v => /kyoko|o-ren|siri/i.test(v.name)) || vs[0] || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

    speechSynthesis.cancel();

    u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = S.rate || 0.9;

/* ---------- saved progress (same names as the PC app's settings file) ---------- */
const DEFAULT = { plan_tasks: {}, plan_days_done: {}, kanji_stats: {}, stickers: {}, days_used: [], study_seconds: {},

let S = Object.assign({}, DEFAULT);
const LS = "n5-teacher-progress";

const SYNC_KEYS = ["plan_tasks", "plan_days_done", "kanji_stats", "stickers", "days_used", "study_seconds"];

function save() {
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}

/* Merge two progress records. Same rules as the PC app: ticks, days and stickers are joined,
   numbers take the larger value, so syncing twice never counts anything double. */
function mergeProgress(a, b) {
  a = a || {}; b = b || {}; const out = {};
  const pt = {}; for (const src of [a.plan_tasks || {}, b.plan_tasks || {}]) for (const [d, ids] of Object.entries(src)) pt[d] = [...new Set([...(pt[d] || []), ...ids])];
  out.plan_tasks = pt;
  const earliest = (x, y) => { const o = Object.assign({}, x || {}); for (const [k, v] of Object.entries(y || {})) o[k] = o[k] && o[k] < v ? o[k] : v; return o; };
  out.plan_days_done = earliest(a.plan_days_done, b.plan_days_done);
  out.stickers = earliest(a.stickers, b.stickers);
  const ks = {}; for (const src of [a.kanji_stats || {}, b.kanji_stats || {}]) for (const [c, v] of Object.entries(src)) { const o = ks[c] || [0, 0]; ks[c] = [Math.max(o[0], v[0] || 0), Math.max(o[1], v[1] || 0)]; }
  out.kanji_stats = ks;
  out.days_used = [...new Set([...(a.days_used || []), ...(b.days_used || [])])].sort();
  const ss = Object.assign({}, a.study_seconds || {}); for (const [d, v] of Object.entries(b.study_seconds || {})) ss[d] = Math.max(ss[d] || 0, v);

}
const pick = o => Object.fromEntries(SYNC_KEYS.map(k => [k, o?.[k]]));

const b64dec = str => decodeURIComponent(escape(atob(str.replace(/\s/g, ""))));

}

      const body = JSON.stringify(Object.assign({}, merged, { updated_by: "phone", updated_at: new Date().toISOString() }), null, 1);

const norm = s => s.replace(/[\s、。！？!?.,・「」]/g, "").toLowerCase();
function ratio(a, b) { // like Python difflib's ratio, via longest common subsequence
  if (!a.length && !b.length) return 1;
  const m = Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) { let prev = 0; for (let j = 1; j <= b.length; j++) { const tmp = m[j]; m[j] = a[i-1] === b[j-1] ? prev + 1 : Math.max(m[j], m[j-1]); prev = tmp; } }
  return 2 * m[b.length] / (a.length + b.length);
}

/* Answer checking: accepts kanji, hiragana, katakana or romaji, and any name in place of the example name. */
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const NAME_RE = /アンッティ|アンティ|あんってぃ|あんてぃ|antti|anti/gi;
const NAME_TEST = /アンッティ|アンティ|あんってぃ|あんてぃ|antti/i;
const KATA_RUN = /[ァ-ヶー]{2,}/g, LATIN_RUN = /[a-z][a-z'-]*/g;
function answerForms(text) {
  const n = norm(text);
  const latin = /^[a-z'\-]+$/.test(n);
  return { raw: n, hira: toHira(n), noName: toHira(n.replace(KATA_RUN, "").replace(latin ? /^$/ : LATIN_RUN, "")), latin };
}
function exampleForms(ex) {
  const jp = norm(ex[0]), kana = norm(ex[1]), rom = norm(ex[2]).replace(/[^a-z]/g, "");
  const hasName = NAME_TEST.test(ex[0] + ex[1]);
  return { jp, kana: toHira(kana), rom, hasName,
    jpNoName: toHira(jp.replace(KATA_RUN, "")), kanaNoName: toHira(kana.replace(KATA_RUN, "")), romNoName: rom.replace(NAME_RE, "") };
}
function scoreAnswer(text, examples) {
  const u = answerForms(text);
  let best = { score: 0, ex: examples[0], mine: u.raw, target: norm(examples[0][0]) };
  for (const ex of examples) {
    const f = exampleForms(ex);
    const tries = u.latin
      ? [[u.raw.replace(/[^a-z]/g, ""), f.rom], ...(f.hasName ? [[u.raw.replace(/[^a-z]/g, ""), f.romNoName]] : [])]
      : [[u.raw, f.jp], [u.hira, f.kana], [u.hira, toHira(f.jp)], ...(f.hasName ? [[u.noName, f.jpNoName], [u.noName, f.kanaNoName]] : [])];
    for (const [mine, target] of tries) {
      let sc = ratio(mine, target);
      if (f.hasName && target.length && (target === f.jpNoName || target === f.kanaNoName || target === f.romNoName)) {
        // the name was removed from both sides: any name is fine, so judge only the rest
        sc = ratio(mine, target);
      }
      if (sc > best.score) best = { score: sc, ex, mine, target };
    }
  }

}
function diffHtml(mine, target) {
  // character diff: green = right, red strike = not needed, orange underline = missing
  const a = [...mine], b = [...target], n = a.length, m = b.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  let i = 0, j = 0, you = "", fix = "";
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { you += `<span class="d-ok">${esc(a[i])}</span>`; fix += `<span class="d-ok">${esc(b[j])}</span>`; i++; j++; }
    else if (j < m && (i >= n || L[i][j+1] >= L[i+1][j])) { fix += `<span class="d-miss">${esc(b[j])}</span>`; j++; }
    else { you += `<span class="d-extra">${esc(a[i])}</span>`; i++; }
  }
  return { you, fix };
}
function answer(text) {
  const l = talk.lines[talk.pos];

  const d = diffHtml(best.mine, best.target);
  const showDiff = best.score < 0.999 && best.mine !== best.target;
  const compare = `<div class="diff"><div><span class="small muted">You wrote</span><div class="dline">${d.you || "&nbsp;"}</div></div>
    <div><span class="small muted">Closest example</span><div class="dline">${d.fix}</div></div>
    <div class="small muted"><span class="d-miss">orange</span> = missing · <span class="d-extra">red</span> = not needed${best.ex && NAME_TEST.test(best.ex[0]) ? " · any name is fine" : ""}</div></div>`;
  if (best.score >= 0.6 || keyHit) {
    talk.log.push({ k: "ok", html: `${best.score >= 0.85 ? "✅ すばらしい！ Great answer!" : "✅ いいですね！ Good answer!"}${showDiff && best.score < 0.85 ? compare : ""}<details><summary>Another way to say it</summary>${exBlock(...rnd(l.examples))}</details>` });

  } else {
    talk.log.push({ k: "no", html: `🤔 Not quite. Here is what was different:${compare}` });
    talk.hint = true; talk.wrong = true;

}

  $("#revBtn").onclick = () => go("kanji", { quiz: true, upto: si });
}
function kanjiQuestions(si, upto) {
  const stats = S.kanji_stats, types = ["meaning", "reading", "kanji"];
  if (upto != null) {
    const pool = ALL_KANJI.filter(([s]) => s <= upto).map(([, k]) => k);
    const w = pool.map(k => { const s = stats[k.char] || [0, 0]; return s[0] <= s[1] ? 3 : 1; });
    const picks = [];
    while (picks.length < Math.min(8, pool.length)) {
      let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0; while (r > w[i]) r -= w[i++];
      if (!picks.includes(pool[i])) picks.push(pool[i]);
    }
    return picks.map(k => [k, rnd(types)]);
  }
  const cur = D.kanji[si][1]; let q = [];
  cur.forEach(k => sample(types, 2).forEach(t => q.push([k, t])));
  const earlier = ALL_KANJI.filter(([s]) => s < si).map(([, k]) => k);
  sample(earlier, Math.min(8 - q.length, earlier.length)).forEach(k => q.push([k, rnd(types)]));
  while (q.length < 8) { const k = rnd(cur); const un = types.filter(t => !q.some(([a, b]) => a === k && b === t)); q.push([k, rnd(un.length ? un : types)]); }
  q = shuffle(q);
  for (let i = 1; i < q.length; i++) if (q[i][0] === q[i-1][0]) { const j = q.findIndex((x, j) => x[0] !== q[i][0] && (j === 0 || q[j-1][0] !== q[i][0]) && (j + 1 >= q.length || q[j+1][0] !== q[i][0])); if (j >= 0) [q[i], q[j]] = [q[j], q[i]]; }
  return q;
}
function kanjiQuiz() {
  const review = page.upto != null;
  if (!kq || kq.key !== JSON.stringify([page.set, page.upto])) {
    kq = { key: JSON.stringify([page.set, page.upto]), qs: kanjiQuestions(page.set ?? 0, review ? page.upto : null), pos: 0, right: 0, missed: [], ans: null };
    kq.qs = kq.qs.map(([k, t]) => buildKQ(k, t));
  }
  setTop(review ? `🔁 Review · ${(page.upto + 1) * 3} kanji` : `🎯 Quiz · Set ${page.set + 1}`, () => { kq = null; go("kanji", { set: page.set ?? S.kanji_set }); });
  if (kq.pos >= kq.qs.length) return kanjiResults();
  const q = kq.qs[kq.pos];
  let h = `<div class="row" style="justify-content:space-between"><b>Question ${kq.pos + 1} / ${kq.qs.length}</b><span>✅ ${kq.right} ❌ ${kq.missed.length}</span></div>
    <div class="bar"><i style="width:${kq.pos / kq.qs.length * 100}%"></i></div>
    <section class="card"><div class="qbig ${q.cls}">${esc(q.show)}</div><div class="muted" style="text-align:center">${esc(q.prompt)}</div></section>
    <div class="chat">${q.opts.map((o, i) => `<button class="opt ${q.jpo ? "jpo" : ""} ${kq.ans != null ? (o === q.answer ? "right" : o === kq.ans ? "wrong" : "") : ""}" data-o="${i}" ${kq.ans != null ? "disabled" : ""}>${esc(o)}${q.type === "reading" ? ` <span class="small" style="font-family:var(--ui);opacity:.75">(${romaji(o)})</span>` : ""}</button>`).join("")}</div>`;
  if (kq.ans != null) {
    const k = q.k, right = kq.ans === q.answer;
    h += `<section class="card" style="background:${right ? "var(--good-soft)" : "var(--bad-soft)"};border:0"><b class="jp">${right ? "✅ Correct!" : "❌ Not quite."} ${esc(k.char)} = ${esc(k.meaning)}</b>
      <div class="jp small">音 ${esc(k.on)} · 訓 ${esc(k.kun)}</div><div>${k.words.map(w => exBlock(w[0], w[1], w[2], w[3])).join("")}</div>
      <button class="btn primary wide" id="next">${kq.pos + 1 >= kq.qs.length ? "See results ▶" : "Next ▶"}</button></section>`;
  }
  $("#main").innerHTML = h;
  $("#main").querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    if (kq.ans != null) return; kq.ans = q.opts[+b.dataset.o];
    const st = S.kanji_stats[q.k.char] = (S.kanji_stats[q.k.char] || [0, 0]).slice();
    if (kq.ans === q.answer) { kq.right++; st[0]++; } else { st[1]++; if (!kq.missed.includes(q.k)) kq.missed.push(q.k); }
    save(); speak(q.k.words[0][0]); kanjiQuiz();
    $("#next")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  $("#next") && ($("#next").onclick = () => { kq.pos++; kq.ans = null; kanjiQuiz(); scrollTo(0, 0); });
}
function buildKQ(k, type) {
  const others = ALL_KANJI.map(([, o]) => o).filter(o => o !== k);
  if (type === "meaning") return { k, type, show: k.char, prompt: "What does this kanji mean?", answer: k.meaning, opts: shuffle([k.meaning, ...sample([...new Set(others.map(o => o.meaning))].filter(m => m !== k.meaning), 2)]), cls: "", jpo: false };
  if (type === "reading") {
    const w = rnd(k.words); const all = [...new Set(others.flatMap(o => o.words.map(x => x[1])))].filter(r => r !== w[1]);
    const close = all.filter(r => r.length === w[1].length);
    return { k, type, show: w[0], prompt: `How do you read this word? (it means “${w[3]}”)`, answer: w[1], opts: shuffle([w[1], ...sample(close.length >= 2 ? close : all, 2)]), cls: "word", jpo: true };
  }
  return { k, type, show: k.meaning, prompt: `Which kanji means “${k.meaning}”?`, answer: k.char, opts: shuffle([k.char, ...sample([...new Set(others.filter(o => o.meaning !== k.meaning).map(o => o.char))], 2)]), cls: "en", jpo: true };
}
function kanjiResults() {
  if (!kq.counted) { kq.counted = true; planTaskDone("kanji", page.upto != null ? "review" : page.set); markUsed(); }
  const total = kq.qs.length;
  $("#main").innerHTML = `<section class="card" style="text-align:center"><div style="font-size:48px">${kq.right >= total - 1 ? "🌸" : kq.right >= total / 2 ? "👍" : "💪"}</div>
    <h2>${kq.right} / ${total} correct</h2><p class="muted">${kq.right === total ? "Perfect! 完璧です！" : "Good work. The ones you missed will come back more often in review quizzes."}</p></section>
    ${kq.missed.length ? `<section class="card"><h3>Look at these again</h3>${kq.missed.map(k => `<div class="row"><span class="jp" style="font-size:40px;font-weight:700">${esc(k.char)}</span><span>${esc(k.meaning)}<br><span class="jp small muted">${esc(k.on)} · ${esc(k.kun)}</span></span></div>`).join("")}</section>` : ""}
    <div class="row"><button class="btn primary" id="again" style="flex:1">↻ New round</button><button class="btn" id="home" style="flex:1">Today ▶</button></div>`;
  $("#again").onclick = () => { kq = null; kanjiQuiz(); };
  $("#home").onclick = () => { kq = null; go("today"); };
}

/* ================= GRAMMAR ================= */
let gt = null;
function Grammar() {
  page.lessonOpenedAt = 0;
  if (page.test != null) return grammarTest();
  if (page.lesson) return grammarLesson();
  setTop("文 · Grammar");
  let h = "";
  D.grammar.forEach(([name, lessons], li) => {
    const st = D.stickers[li], got = st[0] in S.stickers;
    h += `<section class="card lvl" style="--c:${D.levelColors[li]}"><div class="row"><span class="stk ${got ? "" : "off"}" style="--c:${st[4]}">${esc(st[1])}</span><h3 style="flex:1;min-width:0">${esc(name.replace(/^\S+\s/, ""))}</h3></div>
      ${lessons.map((l, i) => `<button class="lesson-btn" data-l="${li},${i}"><span>${esc(l.title)}</span>›</button>`).join("")}
      <button class="btn" data-t="${li}">🏆 Level test · 10 questions${got ? " · sticker earned" : ""}</button></section>`;
  });
  const fin = D.stickers[6], got = "final" in S.stickers;
  h += `<section class="card"><div class="row"><span class="stk ${got ? "" : "off"}" style="--c:${fin[4]};font-size:15px">${fin[1]}</span><h3 style="flex:1">Final N5 grammar test</h3></div>
    <button class="btn primary" data-t="final">👑 Start · 20 questions from every level</button></section>`;
  $("#main").innerHTML = h;
  $("#main").querySelectorAll("[data-l]").forEach(b => b.onclick = () => go("grammar", { lesson: b.dataset.l.split(",").map(Number) }));
  $("#main").querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("grammar", { test: b.dataset.t === "final" ? "final" : +b.dataset.t }));
}
function grammarLesson() {
  const [li, i] = page.lesson; const L = D.grammar[li][1][i];
  S.grammar_lesson = [li, i]; save();
  page.lessonOpenedAt = Date.now(); page.lessonKey = [li, i];
  setTop(esc(L.title), () => go("grammar"));
  const lessons = D.grammar.flatMap(([, ls], a) => ls.map((_, b) => [a, b]));
  const idx = lessons.findIndex(([a, b]) => a === li && b === i);
  let h = `<section class="card"><span class="pill" style="background:${D.levelColors[li]};color:#fff;align-self:flex-start">${esc(D.grammar[li][0].replace(/^\S+\s/, ""))}</span>
    <h2>${esc(L.title)}</h2><div class="pattern">${esc(L.pattern)}</div></section>`;
  L.explanation.forEach((p, n) => {
    const exs = L.para[n] || [];
    h += `<section class="card"><p style="margin:0" class="jp">${esc(p)}</p>${exs.length ? `<div>${exs.map(e => exBlock(...e)).join("")}</div>` : ""}</section>`;
  });
  h += `<section class="card"><h3>Examples</h3>${L.examples.map(([jp, kn, rom, en, note]) => {
    const more = L.more[jp] || [];
    const why = D.exampleGrammar[jp];
    return exBlock(jp, kn, rom, en, `<div class="note">${esc(note)}</div>${why ? `<details><summary>Why this word order</summary><p class="small jp">${esc(why)}</p></details>` : ""}${more.length ? `<details><summary>${more.length} more like this</summary>${more.map(m => exBlock(...m)).join("")}</details>` : ""}`);
  }).join("")}</section>
  <section class="card"><h3>Tips</h3><ul style="margin:0;padding-left:20px" class="jp">${L.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>
  <div class="row">${idx > 0 ? `<button class="btn" id="prev" style="flex:1">‹ Previous</button>` : ""}<button class="btn good" id="read" style="flex:1">✓ Done reading</button>${idx < lessons.length - 1 ? `<button class="btn" id="nextL" style="flex:1">Next ›</button>` : ""}</div>`;
  $("#main").innerHTML = h;
  $("#read").onclick = () => { planTaskDone("lesson", [li, i]); markUsed(); toast("✓ Lesson marked as read"); };
  $("#prev") && ($("#prev").onclick = () => go("grammar", { lesson: lessons[idx - 1] }));
  $("#nextL") && ($("#nextL").onclick = () => go("grammar", { lesson: lessons[idx + 1] }));
}
const PARTICLES = ["は","が","を","に","で","へ","と","の","も","から"];
function buildTest(key) {
  const pool = shuffle(key === "final" ? D.tests.flat() : D.tests[key]);
  const len = key === "final" ? 20 : 10;
  const plan = Array(6).fill(["particle","meaning","order","particle","meaning"]).flat();
  const qs = [], used = new Set();
  const mk = {
    particle(it) { if (!it.gaps.length) return null; const g = rnd(it.gaps); const wrong = PARTICLES.filter(p => p !== g.answer && !(D.alsoOk[g.answer] || []).includes(p));
      return { type: "particle", it, prompt: "Which particle goes in the gap?", show: g.blanked, answer: g.answer, opts: shuffle([g.answer, ...sample(wrong, 3)]) }; },
    meaning(it) { const others = [...new Set(pool.map(p => p.en).filter(e => e && e !== it.en))]; if (others.length < 3 || !it.en) return null;
      return { type: "meaning", it, prompt: "What does this sentence mean?", show: it.jp, answer: it.en, opts: shuffle([it.en, ...sample(others, 3)]) }; },
    order(it) { const c = it.chunks; if (c.length < 3) return null; const ok = c.join("　");
      const v = [[c[c.length-1], ...c.slice(0,-1)].join("　"), [c[0], c[c.length-1], ...c.slice(1,-1)].join("　")];
      const opts = [ok, ...[...new Set(v)].filter(x => x !== ok)]; if (opts.length < 3) return null;
      return { type: "order", it, prompt: `Which word order is correct? “${it.en}”`, show: "", answer: ok, opts: shuffle(opts) }; }
  };
  for (const kind of plan) { if (qs.length >= len) break; for (const it of pool) { if (used.has(it.jp)) continue; const q = mk[kind](it); if (q) { qs.push(q); used.add(it.jp); break; } } }
  for (const it of pool) { if (qs.length >= len) break; if (!used.has(it.jp)) { const q = mk.meaning(it) || mk.particle(it); if (q) { qs.push(q); used.add(it.jp); } } }
  return qs;
}
function grammarTest() {
  const key = page.test;
  const st = key === "final" ? D.stickers[6] : D.stickers[key];
  const name = key === "final" ? "Final N5 test" : D.grammar[key][0].replace(/^\S+\s/, "") + " · test";
  if (!gt || gt.key !== key) gt = { key, qs: buildTest(key), pos: -1, right: 0, wrong: [], ans: null };
  setTop(esc(name), () => { gt = null; go("grammar"); });
  if (gt.pos < 0) {
    $("#main").innerHTML = `<section class="card" style="text-align:center"><span class="stk ${st[0] in S.stickers ? "" : "off"}" style="--c:${st[4]};margin:0 auto;width:80px;height:80px;font-size:32px">${esc(st[1])}</span>
      <h2>${esc(name)}</h2><p class="muted">${gt.qs.length} questions: particles, meanings and word order. Get ${Math.round(0.8 * gt.qs.length)} right to earn the <span class="jp">${esc(st[1])}</span> sticker.</p>
      <button class="btn primary wide" id="go">Start the test</button></section>`;
    $("#go").onclick = () => { gt.pos = 0; grammarTest(); };
    return;
  }
  if (gt.pos >= gt.qs.length) return testResults(st, name);
  const q = gt.qs[gt.pos];
  let h = `<div class="row" style="justify-content:space-between"><b>Question ${gt.pos + 1} / ${gt.qs.length}</b><span>✅ ${gt.right} ❌ ${gt.wrong.length}</span></div>
    <div class="bar"><i style="width:${gt.pos / gt.qs.length * 100}%"></i></div>
    <section class="card"><div class="muted">${esc(q.prompt)}</div>${q.type === "particle" ? `<div class="big-jp">${esc(q.show)}</div><div class="small muted">${esc(q.it.en)}</div>` : q.type === "meaning" ? `<div class="big-jp">${ruby(q.show)}</div>` : ""}</section>
    <div class="chat">${q.opts.map((o, i) => `<button class="opt ${q.type !== "meaning" ? "jpo" : ""} ${gt.ans != null ? (o === q.answer ? "right" : o === gt.ans ? "wrong" : "") : ""}" data-o="${i}" ${gt.ans != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>`;
  if (gt.ans != null) {
    const right = gt.ans === q.answer;
    const why = q.type === "particle" ? (D.particleJobs[q.answer] || "") : q.type === "order" ? "In Japanese the verb (or です) always comes last." : "";
    h += `<section class="card" style="background:${right ? "var(--good-soft)" : "var(--bad-soft)"};border:0"><b>${right ? "✅ Correct!" : "❌ Not quite."}</b>
      ${exBlock(q.it.jp, q.it.kana, q.it.romaji, q.it.en)}${why ? `<div class="small jp">${esc(why)}</div>` : ""}<div class="small muted">From the lesson: ${esc(q.it.lesson)}</div>
      <button class="btn primary wide" id="next">${gt.pos + 1 >= gt.qs.length ? "See results ▶" : "Next ▶"}</button></section>`;
  }
  $("#main").innerHTML = h;
  $("#main").querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    if (gt.ans != null) return; gt.ans = q.opts[+b.dataset.o];
    if (gt.ans === q.answer) gt.right++; else gt.wrong.push(q);
    grammarTest(); $("#next")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  $("#next") && ($("#next").onclick = () => { gt.pos++; gt.ans = null; grammarTest(); scrollTo(0, 0); });
}
function testResults(st, name) {
  const total = gt.qs.length, need = Math.round(0.8 * total), passed = gt.right >= need;
  let fresh = false;
  if (!gt.counted) { gt.counted = true; planTaskDone("test", gt.key); markUsed(); if (passed && !(st[0] in S.stickers)) { S.stickers[st[0]] = today(); fresh = true; save(); } }
  const lessons = [...new Set(gt.wrong.map(q => q.it.lesson))];
  $("#main").innerHTML = `<section class="card" style="text-align:center"><span class="stk ${passed ? "" : "off"}" style="--c:${st[4]};margin:0 auto;width:90px;height:90px;font-size:36px">${esc(st[1])}</span>
    <h2>${gt.right} / ${total} ${passed ? "· Passed!" : ""}</h2><p class="muted">${passed ? (fresh ? `New sticker: ${esc(st[3])}! 合格です！` : "Passed again. Well done.") : `You need ${need} to pass. Read the lessons below again, then try once more.`}</p></section>
    ${lessons.length ? `<section class="card"><h3>Lessons to look at again</h3>${lessons.map(t => { const pos = D.grammar.flatMap(([, ls], a) => ls.map((l, b) => [l.title, a, b])).find(x => x[0] === t); return `<button class="lesson-btn" data-l="${pos[1]},${pos[2]}"><span>${esc(t)}</span>›</button>`; }).join("")}</section>` : ""}
    <div class="row"><button class="btn primary" id="again" style="flex:1">↻ Take it again</button><button class="btn" id="home" style="flex:1">Today ▶</button></div>`;
  $("#main").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { gt = null; go("grammar", { lesson: b.dataset.l.split(",").map(Number) }); });
  $("#again").onclick = () => { const k = gt.key; gt = null; go("grammar", { test: k }); };
  $("#home").onclick = () => { gt = null; go("today"); };
}

/* ================= PHRASES ================= */
function Phrases() {
  setTop("言 · Everyday phrases");
  const cats = [...new Set(D.sentences.map(s => s.cat))];
  const cat = page.cat || cats[0];
  page.flip = page.flip || {};
  const list = D.sentences.filter(s => s.cat === cat);
  $("#main").innerHTML = `<div class="sets">${cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <section class="card">${list.map((s, n) => { const f = page.flip[s.jp] && s.opp; const x = f ? { jp: s.opp[0], kana: s.opp[1], romaji: s.opp[2], en: s.opp[3], note: s.opp[4] } : s;
      return exBlock(x.jp, x.kana, x.romaji, x.en, `<div class="small muted">${esc(x.note)}</div>${s.opp ? `<div class="seg" style="margin-top:6px;max-width:240px"><button class="${f ? "" : "on"}" data-f="${esc(s.jp)}" data-v="0">➕ Positive</button><button class="${f ? "on" : ""}" data-f="${esc(s.jp)}" data-v="1">➖ Negative</button></div>` : ""}`); }).join("")}</section>`;
  $("#main").querySelectorAll("[data-c]").forEach(b => b.onclick = () => go("phrases", { cat: b.dataset.c }));
  $("#main").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { page.flip[b.dataset.f] = b.dataset.v === "1"; Phrases(); });
}

/* ---------- start ---------- */
applyPrefs();
const start = location.hash.slice(1);
page.tab = TABS.some(t => t[0] === start) ? start : "today";
route();
syncNow();
</script>
