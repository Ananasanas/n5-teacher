<script type="application/json" id="data">{"dialogues":{"👋 Meeting someone new":[{"jp":"こんにちは。はじめまして、さくらです。お名前は何ですか。","kana":"こんにちは。はじめまして、さくらです。おなまえは なんですか。","romaji":"Konnichiwa. Hajimemashite, Sakura desu. O-namae wa nan desu ka?","en":"Hello. Nice to meet you, I'm Sakura. What's your name?","examples":[["はじめまして、アンッティです。","はじめまして、アンッティです。","Hajimemashite, Antti desu.","Nice to meet you, I'm Antti."],["アンッティです。よろしくお願いします。","アンッティです。よろしく おねがいします。","Antti desu. Yoroshiku onegaishimasu.","I'm Antti. Pleased to meet you."],["私の名前はアンッティです。","わたしの なまえは アンッティです。","Watashi no namae wa Antti desu.","My name is Antti."]],"keys":["アンッティ","アンティ","あんてぃ","antti","です","はじめまして"]},{"jp":"アンッティさんは、どこから来ましたか。","kana":"アンッティさんは、どこから きましたか。","romaji":"Antti-san wa, doko kara kimashita ka?","en":"Where are you from, Antti?","examples":[["フィンランドから来ました。","フィンランドから きました。","Finrando kara kimashita.","I came from Finland."],["ヘルシンキから来ました。","ヘルシンキから きました。","Herushinki kara kimashita.","I came from Helsinki."],["フィンランド人です。","フィンランドじんです。","Finrando-jin desu.","I'm Finnish."]],"keys":["フィンランド","ヘルシンキ","から","来ました","きました","人です","じんです"]},{"jp":"そうですか。日本語の勉強は楽しいですか。","kana":"そうですか。にほんごの べんきょうは たのしいですか。","romaji":"Sou desu ka. Nihongo no benkyou wa tanoshii desu ka?","en":"I see. Is studying Japanese fun?","examples":[["はい、とても楽しいです。","はい、とても たのしいです。","Hai, totemo tanoshii desu.","Yes, it's a lot of fun."],["はい、でも少し難しいです。","はい、でも すこし むずかしいです。","Hai, demo sukoshi muzukashii desu.","Yes, but it's a little difficult."],["漢字は難しいですが、楽しいです。","かんじは むずかしいですが、たのしいです。","Kanji wa muzukashii desu ga, tanoshii desu.","Kanji is hard, but it's fun."]],"keys":["楽しい","たのしい","難しい","むずかしい","はい","いいえ"]},{"jp":"すごいですね！これからも、がんばってください。","kana":"すごいですね！これからも、がんばって ください。","romaji":"Sugoi desu ne! Korekara mo, ganbatte kudasai.","en":"Amazing! Keep up the good work.","examples":[["ありがとうございます。","ありがとう ございます。","Arigatou gozaimasu.","Thank you very much."],["はい、がんばります！","はい、がんばります！","Hai, ganbarimasu!","Yes, I'll do my best!"],["ありがとうございます。さくらさんも！","ありがとう ございます。さくらさんも！","Arigatou gozaimasu. Sakura-san mo!","Thank you. You too, Sakura!"]],"keys":["ありがとう","がんばります"]},{"jp":"じゃ、また今度。","kana":"じゃ、また こんど。","romaji":"Ja, mata kondo.","en":"Well, see you next time.","examples":[],"keys":[]}],"☕ At a café":[{"jp":"いらっしゃいませ。何にしますか。","kana":"いらっしゃいませ。なにに しますか。","romaji":"Irasshaimase. Nani ni shimasu ka?","en":"Welcome! What would you like?","examples":[["コーヒーをください。","コーヒーを ください。","Koohii o kudasai.","A coffee, please."],["紅茶をお願いします。","こうちゃを おねがいします。","Koucha o onegaishimasu.","Black tea, please."],["コーヒーを一つください。","コーヒーを ひとつ ください。","Koohii o hitotsu kudasai.","One coffee, please."]],"keys":["ください","お願い","おねがい","紅茶","こうちゃ"]},{"jp":"ホットとアイス、どちらがいいですか。","kana":"ホットと アイス、どちらが いいですか。","romaji":"Hotto to aisu, dochira ga ii desu ka?","en":"Hot or iced, which would you like?","examples":[["ホットでお願いします。","ホットで おねがいします。","Hotto de onegaishimasu.","Hot, please."],["アイスをください。","アイスを ください。","Aisu o kudasai.","Iced, please."],["ホットがいいです。","ホットが いいです。","Hotto ga ii desu.","Hot would be good."]],"keys":["ホット","アイス","お願い","おねがい"]},{"jp":"ケーキもいかがですか。","kana":"ケーキも いかがですか。","romaji":"Keeki mo ikaga desu ka?","en":"Would you like some cake too?","examples":[["いいえ、けっこうです。","いいえ、けっこうです。","Iie, kekkou desu.","No, thank you."],["はい、一つお願いします。","はい、ひとつ おねがいします。","Hai, hitotsu onegaishimasu.","Yes, one please."],["はい、チーズケーキをください。","はい、チーズケーキを ください。","Hai, chiizukeeki o kudasai.","Yes, a cheesecake please."]],"keys":["いいえ","けっこう","結構","はい","ください","お願い","おねがい"]},{"jp":"全部で四百円です。","kana":"ぜんぶで よんひゃくえんです。","romaji":"Zenbu de yonhyaku en desu.","en":"That's 400 yen altogether.","examples":[["カードでいいですか。","カードで いいですか。","Kaado de ii desu ka?","Is it OK to pay by card?"],["はい、これでお願いします。","はい、これで おねがいします。","Hai, kore de onegaishimasu.","Yes, here you are."],["千円でいいですか。","せんえんで いいですか。","Sen en de ii desu ka?","Is a 1,000-yen note OK?"]],"keys":["カード","はい","これ","円","えん","お願い","おねがい"]},{"jp":"はい、大丈夫です。ありがとうございました！","kana":"はい、だいじょうぶです。ありがとう ございました！","romaji":"Hai, daijoubu desu. Arigatou gozaimashita!","en":"Yes, that's fine. Thank you very much!","examples":[],"keys":[]}],"🚉 Asking the way":[{"jp":"こんにちは。どうしましたか。","kana":"こんにちは。どう しましたか。","romaji":"Konnichiwa. Dou shimashita ka?","en":"Hello. Can I help you?","examples":[["すみません、駅はどこですか。","すみません、えきは どこですか。","Sumimasen, eki wa doko desu ka?","Excuse me, where is the station?"],["駅に行きたいです。","えきに いきたいです。","Eki ni ikitai desu.","I want to go to the station."],["あのう、駅はどちらですか。","あのう、えきは どちらですか。","Anou, eki wa dochira desu ka?","Um, which way is the station?"]],"keys":["駅","えき","どこ","どちら"]},{"jp":"駅ですか。この道をまっすぐ行ってください。","kana":"えきですか。この みちを まっすぐ いって ください。","romaji":"Eki desu ka. Kono michi o massugu itte kudasai.","en":"The station? Please go straight along this road.","examples":[["まっすぐですね。","まっすぐですね。","Massugu desu ne.","Straight ahead, right?"],["はい、わかりました。","はい、わかりました。","Hai, wakarimashita.","Yes, I understand."],["この道ですね。","この みちですね。","Kono michi desu ne.","This road, right?"]],"keys":["まっすぐ","真っ直ぐ","はい","わかりました","分かりました","道","みち"]},{"jp":"はい。それから、銀行の前で右に曲がってください。","kana":"はい。それから、ぎんこうの まえで みぎに まがって ください。","romaji":"Hai. Sorekara, ginkou no mae de migi ni magatte kudasai.","en":"Yes. Then turn right in front of the bank.","examples":[["銀行の前で右ですね。","ぎんこうの まえで みぎですね。","Ginkou no mae de migi desu ne.","Right at the bank, got it."],["右ですね。わかりました。","みぎですね。わかりました。","Migi desu ne. Wakarimashita.","To the right. Got it."],["すみません、もう一度お願いします。","すみません、もう いちど おねがいします。","Sumimasen, mou ichido onegaishimasu.","Sorry, once more please."]],"keys":["右","みぎ","銀行","ぎんこう","わかりました","分かりました","もう一度","もういちど"]},{"jp":"そうです。駅は近いですよ。歩いて五分ぐらいです。","kana":"そうです。えきは ちかいですよ。あるいて ごふん ぐらいです。","romaji":"Sou desu. Eki wa chikai desu yo. Aruite go-fun gurai desu.","en":"That's right. The station is close. About five minutes on foot.","examples":[["ありがとうございました。","ありがとう ございました。","Arigatou gozaimashita.","Thank you very much."],["五分ですね。ありがとうございます。","ごふんですね。ありがとう ございます。","Go-fun desu ne. Arigatou gozaimasu.","Five minutes, OK. Thank you."],["近いですね。よかったです。","ちかいですね。よかったです。","Chikai desu ne. Yokatta desu.","It's close. That's good."]],"keys":["ありがとう","近い","ちかい","よかった","五分","ごふん"]},{"jp":"どういたしまして。気をつけて！","kana":"どういたしまして。きを つけて！","romaji":"Dou itashimashite. Ki o tsukete!","en":"You're welcome. Take care!","examples":[],"keys":[]}],"☀️ Morning small talk":[{"jp":"おはようございます！","kana":"おはよう ございます！","romaji":"Ohayou gozaimasu!","en":"Good morning!","examples":[["おはようございます。","おはよう ございます。","Ohayou gozaimasu.","Good morning."],["おはようございます。お元気ですか。","おはよう ございます。おげんきですか。","Ohayou gozaimasu. O-genki desu ka?","Good morning. How are you?"],["おはよう！","おはよう！","Ohayou!","Morning! (casual)"]],"keys":["おはよう"]},{"jp":"今日はいい天気ですね。","kana":"きょうは いい てんきですね。","romaji":"Kyou wa ii tenki desu ne.","en":"Nice weather today, isn't it?","examples":[["そうですね。","そうですね。","Sou desu ne.","It is, isn't it."],["はい、とてもいい天気ですね。","はい、とても いい てんきですね。","Hai, totemo ii tenki desu ne.","Yes, really nice weather."],["そうですね。でも、ちょっと寒いです。","そうですね。でも、ちょっと さむいです。","Sou desu ne. Demo, chotto samui desu.","Yes. But it's a little cold."]],"keys":["そう","はい","いい天気","いいてんき","寒い","さむい","暑い","あつい"]},{"jp":"毎朝、何時に起きますか。","kana":"まいあさ、なんじに おきますか。","romaji":"Maiasa, nanji ni okimasu ka?","en":"What time do you get up every morning?","examples":[["七時に起きます。","しちじに おきます。","Shichi-ji ni okimasu.","I get up at seven."],["六時半に起きます。","ろくじはんに おきます。","Roku-ji han ni okimasu.","I get up at half past six."],["だいたい八時ごろ起きます。","だいたい はちじごろ おきます。","Daitai hachi-ji goro okimasu.","I usually get up around eight."]],"keys":["時","じ","起き","おき"]},{"jp":"朝ご飯は何を食べますか。","kana":"あさごはんは なにを たべますか。","romaji":"Asagohan wa nani o tabemasu ka?","en":"What do you eat for breakfast?","examples":[["パンを食べます。","パンを たべます。","Pan o tabemasu.","I eat bread."],["ご飯とみそしるを食べます。","ごはんと みそしるを たべます。","Gohan to misoshiru o tabemasu.","I eat rice and miso soup."],["朝ご飯は食べません。コーヒーだけです。","あさごはんは たべません。コーヒーだけです。","Asagohan wa tabemasen. Koohii dake desu.","I don't eat breakfast. Just coffee."]],"keys":["食べ","たべ","コーヒー"]},{"jp":"いいですね。じゃ、また明日！","kana":"いいですね。じゃ、また あした！","romaji":"Ii desu ne. Ja, mata ashita!","en":"Sounds good. See you tomorrow!","examples":[],"keys":[]}],"🛍️ Shopping for clothes":[{"jp":"いらっしゃいませ。","kana":"いらっしゃいませ。","romaji":"Irasshaimase.","en":"Welcome!","examples":[["すみません、このシャツはいくらですか。","すみません、この シャツは いくらですか。","Sumimasen, kono shatsu wa ikura desu ka?","Excuse me, how much is this shirt?"],["これはいくらですか。","これは いくらですか。","Kore wa ikura desu ka?","How much is this?"],["すみません、シャツはありますか。","すみません、シャツは ありますか。","Sumimasen, shatsu wa arimasu ka?","Excuse me, do you have shirts?"]],"keys":["いくら","ありますか","シャツ"]},{"jp":"そのシャツは三千円です。","kana":"その シャツは さんぜんえんです。","romaji":"Sono shatsu wa sanzen en desu.","en":"That shirt is 3,000 yen.","examples":[["ちょっと高いですね。","ちょっと たかいですね。","Chotto takai desu ne.","That's a bit expensive."],["もっと安いのはありますか。","もっと やすいのは ありますか。","Motto yasui no wa arimasu ka?","Do you have a cheaper one?"],["じゃ、それをください。","じゃ、それを ください。","Ja, sore o kudasai.","OK, I'll take it."]],"keys":["高い","たかい","安い","やすい","ください","ありますか"]},{"jp":"じゃ、こちらはどうですか。二千円です。","kana":"じゃ、こちらは どうですか。にせんえんです。","romaji":"Ja, kochira wa dou desu ka? Nisen en desu.","en":"Then how about this one? It's 2,000 yen.","examples":[["いいですね。それをください。","いいですね。それを ください。","Ii desu ne. Sore o kudasai.","Nice. I'll take that one."],["青いのはありますか。","あおいのは ありますか。","Aoi no wa arimasu ka?","Do you have a blue one?"],["これを着てもいいですか。","これを きても いいですか。","Kore o kite mo ii desu ka?","May I try this on?"]],"keys":["ください","お願い","おねがい","いい","ありますか"]},{"jp":"ありがとうございます。袋はいりますか。","kana":"ありがとう ございます。ふくろは いりますか。","romaji":"Arigatou gozaimasu. Fukuro wa irimasu ka?","en":"Thank you. Do you need a bag?","examples":[["いいえ、いりません。","いいえ、いりません。","Iie, irimasen.","No, I don't need one."],["はい、お願いします。","はい、おねがいします。","Hai, onegaishimasu.","Yes, please."],["大丈夫です。ありがとうございます。","だいじょうぶです。ありがとう ございます。","Daijoubu desu. Arigatou gozaimasu.","I'm fine without one. Thank you."]],"keys":["いりません","いいえ","はい","いります","お願い","おねがい","大丈夫","だいじょうぶ"]},{"jp":"ありがとうございました。また来てください！","kana":"ありがとう ございました。また きて ください！","romaji":"Arigatou gozaimashita. Mata kite kudasai!","en":"Thank you very much. Please come again!","examples":[],"keys":[]}]},"roundTips":["First time: press 💡 Hint whenever you need it.","Second time: switch “Show English” off and listen first.","Third time: try every answer before opening 💡 Hint.","Fourth time: speak every answer out loud with 🎤 — no typing.","Fifth time: answer quickly, within about 5 seconds, like a real conversation.","Sixth time: change one detail in each answer (another place, food or time) to make it your own."],"exampleGrammar":{"はじめまして、アンッティです。":"Greeting + Name + です. はじめまして ('nice to meet you') always comes first when you meet someone. Then 'Antti です' = '(I) am Antti': the subject 私は is left out because it's obvious, and です goes at the very end — in Japanese the verb or です always finishes the sentence.","アンッティです。よろしくお願いします。":"Name + です, then the set phrase よろしくお願いします. In a Japanese self-introduction you say your name first and always close with よろしくお願いします ('please treat me kindly').","私の名前はアンッティです。":"A の B は C です = 'A's B is C'. 私の名前 = 'my name' (の joins owner → thing, owner first). は marks the topic, then the information, then です: Topic は + Information + です.","フィンランドから来ました。":"Place + から + 来ました. から ('from') comes AFTER the place because Japanese particles follow the word they mark. The verb 来ました ('came') goes last, as verbs always do.","ヘルシンキから来ました。":"Same pattern with a city: [place] から 来ました. The topic 私は is dropped because the teacher asked about you.","フィンランド人です。":"Country + 人 (じん) = a person from that country. Then です at the end: 'I'm a Finn'. Nationality pattern: X人です.","はい、とても楽しいです。":"はい answers first, then the description. とても ('very') goes directly before the adjective it describes, and 楽しい + です makes it polite. Order: answer → adverb → adjective → です.","はい、でも少し難しいです。":"でも ('but') starts the contrasting part. 少し ('a little') goes right before 難しい ('difficult'), just like とても. Adjective + です finishes the sentence.","漢字は難しいですが、楽しいです。":"A は X ですが、Y です = 'A is X, but Y'. が after です joins two opposite ideas ('but'). The topic 漢字 is said once at the start and covers both halves.","ありがとうございます。":"Polite set phrase 'thank you very much'. ございます adds politeness, so it comes after ありがとう.","はい、がんばります！":"がんばります = 'I'll do my best' (polite form of がんばる). はい accepts the encouragement first; the verb ends the sentence.","ありがとうございます。さくらさんも！":"Thanks first, then Name + さん + も = 'you too, Sakura'. も ('too, also') follows the person it's about. Never use さん with your own name.","コーヒーをください。":"[thing] を ください = 'please give me [thing]'. を marks what you want and comes right after it; ください ('please give') is the verb, so it goes last.","紅茶をお願いします。":"[thing] を お願いします is a slightly more polite way to order. Same order as with ください: object + を + verb at the end.","コーヒーを一つください。":"[thing] を [number + counter] ください. The amount (一つ = one item) comes AFTER the thing and を, right before the verb — in Japanese the number usually follows what is counted.","ホットでお願いします。":"で here means 'as / in the form of': 'hot, please'. Choice + で + お願いします is the natural way to pick an option.","アイスをください。":"Object + を + ください: the thing you choose comes first, the request verb last.","ホットがいいです。":"X が いいです = 'X would be good / I'd like X'. が marks the thing you choose, and いいです ('is good') ends the sentence.","いいえ、けっこうです。":"いいえ ('no') first, then けっこうです = 'I'm fine, thank you' — the polite way to decline an offer.","はい、一つお願いします。":"はい accepts, then the amount 一つ and the request お願いします at the end. The cake isn't repeated because the question already mentioned it.","はい、チーズケーキをください。":"Accept with はい, then the ordering pattern [thing] を ください. Foreign words like チーズケーキ (cheesecake) are written in katakana.","カードでいいですか。":"[method] で いいですか = 'is it OK with [method]?'. で marks the means (by card), いいです = 'is OK', and か at the end turns it into a question.","はい、これでお願いします。":"これ ('this') + で ('with') + お願いします = 'with this, please' — said while handing over your card or money.","千円でいいですか。":"Same pattern as カードでいいですか: [what you pay with] で いいですか. 千円 (1,000 yen) is the 'means' of paying, so it takes で.","すみません、駅はどこですか。":"すみません gets attention first. Then Place は どこですか = 'where is [place]?': the place is the topic (は), どこ ('where') is the question word, and か makes it a question.","駅に行きたいです。":"Place + に (destination) + 行きたい ('want to go'). ～たい is added to the verb stem (行き + たい) to say 'want to'; です makes it polite and ends the sentence.","あのう、駅はどちらですか。":"あのう is a soft 'um, excuse me'. どちら is a politer word for どこ ('which way / where'). Same order: Topic は + question word + ですか.","まっすぐですね。":"まっすぐ ('straight') + です + ね. ね at the end checks that you understood correctly: '…, right?'.","はい、わかりました。":"はい + わかりました ('I understood'). The past form is used because you have just understood.","この道ですね。":"この + noun = 'this ___'. この must come directly before its noun (この道 = this road); ですね checks you have it right.","銀行の前で右ですね。":"A の 前 = 'in front of A' (A first, then 前). で marks where the turn happens, 右 is the direction, ですね confirms. Order: landmark → position → で → direction.","右ですね。わかりました。":"Repeat the key word with ですね to confirm it, then わかりました to show you understood.","すみません、もう一度お願いします。":"もう一度 = 'one more time'. It goes before お願いします because the request verb always comes last.","ありがとうございました。":"The past form ございました is used because the help has already been given.","五分ですね。ありがとうございます。":"Number + 分 ('minutes') + ですね confirms the time, then you say thank you.","近いですね。よかったです。":"近い + ですね = 'it's close, isn't it'. よかったです is the past form of いいです, used to mean 'that's good / what a relief'.","おはようございます。":"Polite 'good morning'. ございます makes it polite — use it with teachers, colleagues and strangers.","おはようございます。お元気ですか。":"Greeting first, then お元気ですか ('how are you?'). The お before 元気 adds politeness when you ask about someone else.","おはよう！":"Casual 'morning!' for friends and family. Leaving out ございます makes it informal.","そうですね。":"そう ('so') + です + ね = 'it is, isn't it'. ね at the end shows you agree with the other person.","はい、とてもいい天気ですね。":"とても ('very') → いい ('good') → 天気 ('weather'): adverb, then adjective, then noun. Adjectives always come BEFORE the noun they describe.","そうですね。でも、ちょっと寒いです。":"Agree first with そうですね, then でも ('but') brings in a different point. ちょっと ('a little') goes before the adjective 寒い.","七時に起きます。":"Time + に + verb: に marks an exact clock time, and the verb 起きます ('get up') comes last.","六時半に起きます。":"半 ('half') follows the hour: 六時半 = 6:30. Then the same time + に + verb pattern.","だいたい八時ごろ起きます。":"ごろ ('around') comes AFTER the time: 八時ごろ. With ごろ the に is usually dropped. だいたい ('usually, roughly') goes at the start.","パンを食べます。":"Object + を + verb: パン is what you eat, を marks it, and 食べます ends the sentence. Japanese word order is Subject – Object – Verb.","ご飯とみそしるを食べます。":"と = 'and' for listing nouns (A と B). The whole list takes one を, then the verb.","朝ご飯は食べません。コーヒーだけです。":"は instead of を shows contrast ('breakfast — I don't eat'). 食べません is the negative. だけ ('only') follows its noun: コーヒーだけ = only coffee.","すみません、このシャツはいくらですか。":"この + noun ('this shirt') is the topic with は; いくら ('how much') + ですか asks the price.","これはいくらですか。":"これ ('this one') stands alone without a noun. Topic は → question word いくら → ですか.","すみません、シャツはありますか。":"Thing は ありますか = 'do you have [thing]?'. あります is used for things (not people or animals) and goes at the end.","ちょっと高いですね。":"ちょっと ('a bit') softens the adjective 高い ('expensive'); ですね shares your feeling with the other person.","もっと安いのはありますか。":"もっと ('more') + 安い ('cheap') + の ('one') = 'a cheaper one'. の replaces the noun so you don't repeat シャツ; は ありますか asks if it exists.","じゃ、それをください。":"じゃ ('well then') starts the decision. それ ('that one', near the other person) + を + ください.","いいですね。それをください。":"いいですね shows you like it; then the ordering pattern それ を ください.","青いのはありますか。":"Adjective + の = 'a ___ one': 青いの = 'a blue one'. The adjective comes before の, just as it would before a noun.","これを着てもいいですか。":"Verb て-form + も いいですか = 'may I…?'. The object これを comes first, then 着て ('wear') + もいいですか to ask permission.","いいえ、いりません。":"いりません = 'I don't need (it)', the negative of いります. The bag isn't repeated because the question already mentioned it.","はい、お願いします。":"Simple polite 'yes, please': はい accepts and お願いします makes the request.","大丈夫です。ありがとうございます。":"大丈夫です ('it's fine / no need') is a soft way to say no, followed by thanks to stay polite."},"grammar":[["🟢 Level 1 · Foundations",[{"title":"Word order: Subject – Object – Verb","pattern":"(Topic は)  +  (Object を)  +  Verb。","explanation":["In English the verb comes in the middle (I EAT bread). In Japanese the verb ALWAYS comes at the very end of the sentence: 私はパンを食べます = literally 'I bread eat'. Whatever happens in the sentence, you wait until the end to hear what is done.","Small words called particles (は, を, に, で …) come AFTER a word and tell you its job in the sentence. Because the particles carry the meaning, the other parts can move around a little — but the verb stays last.","Japanese often leaves out the subject when it's obvious. If you say パンを食べます on its own, everyone understands 'I eat bread'. Saying 私は again and again sounds unnatural."],"tips":["Keep the verb last — 'Watashi wa taberu pan' is wrong.","Drop 私は when it's clear you are talking about yourself.","Polite verbs end in ～ます; that's the form to use with people you don't know well."],"examples":[["私はパンを食べます。","わたしは パンを たべます。","Watashi wa pan o tabemasu.","I eat bread.","Topic は → object を → verb"],["毎朝コーヒーを飲みます。","まいあさ コーヒーを のみます。","Maiasa koohii o nomimasu.","I drink coffee every morning.","Subject left out; time word first"],["友達は日本語を勉強します。","ともだちは にほんごを べんきょう します。","Tomodachi wa nihongo o benkyou shimasu.","My friend studies Japanese.","Noun + します makes a verb"]],"more":{"私はパンを食べます。":[["私は水を飲みます。","わたしは みずを のみます。","Watashi wa mizu o nomimasu.","I drink water."],["父は新聞を読みます。","ちちは しんぶんを よみます。","Chichi wa shinbun o yomimasu.","My father reads the newspaper."]],"毎朝コーヒーを飲みます。":[["毎朝シャワーを浴びます。","まいあさ シャワーを あびます。","Maiasa shawaa o abimasu.","I take a shower every morning."],["毎日、漢字を練習します。","まいにち、かんじを れんしゅう します。","Mainichi, kanji o renshuu shimasu.","I practise kanji every day."]],"友達は日本語を勉強します。":[["兄は英語を教えます。","あには えいごを おしえます。","Ani wa eigo o oshiemasu.","My older brother teaches English."],["先生は漢字を書きます。","せんせいは かんじを かきます。","Sensei wa kanji o kakimasu.","The teacher writes kanji."]]},"para":[[["私はりんごを食べます。","わたしは りんごを たべます。","Watashi wa ringo o tabemasu.","I eat an apple."],["姉は音楽を聞きます。","あねは おんがくを ききます。","Ane wa ongaku o kikimasu.","My older sister listens to music."]],[["田中さんは手紙を書きます。","たなかさんは てがみを かきます。","Tanaka-san wa tegami o kakimasu.","Mr. Tanaka writes a letter."],["私は駅で友達に会います。","わたしは えきで ともだちに あいます。","Watashi wa eki de tomodachi ni aimasu.","I meet my friend at the station."]],[["毎晩テレビを見ます。","まいばん テレビを みます。","Maiban terebi o mimasu.","I watch TV every evening."],["お茶を飲みますか。","おちゃを のみますか。","Ocha o nomimasu ka?","Will you have some tea?"]]]},{"title":"X は Y です — saying what something is","pattern":"X は Y です。          (X is Y)\nX は Y じゃありません。  (X is not Y)\nX は Y でした。         (X was Y)","explanation":["です is the polite word for 'is / am / are'. It never changes for I, you, he or they: 私は学生です (I am a student), 田中さんは先生です (Mr Tanaka is a teacher).","は (written は but pronounced 'wa') marks the TOPIC — what you are talking about. Think of it as 'As for X, …'. Everything after は is information about that topic.","To make it negative, replace です with じゃありません (in writing or formal speech: ではありません). For the past, use でした; past negative is じゃありませんでした."],"tips":["は as a particle is always read 'wa', never 'ha'.","Don't put です after a verb: 食べますです is wrong.","じゃないです is a softer, common spoken form of じゃありません."],"examples":[["私は学生です。","わたしは がくせいです。","Watashi wa gakusei desu.","I am a student.","X は Y です"],["これは本じゃありません。","これは ほんじゃ ありません。","Kore wa hon ja arimasen.","This is not a book.","Negative: じゃありません"],["昨日は雨でした。","きのうは あめでした。","Kinou wa ame deshita.","It was rainy yesterday.","Past: でした"]],"more":{"私は学生です。":[["私はフィンランド人です。","わたしは フィンランドじんです。","Watashi wa Finrando-jin desu.","I am Finnish."],["妹は高校生です。","いもうとは こうこうせいです。","Imouto wa koukousei desu.","My younger sister is a high-school student."]],"これは本じゃありません。":[["それは私のかさじゃありません。","それは わたしの かさじゃ ありません。","Sore wa watashi no kasa ja arimasen.","That isn't my umbrella."],["今日は休みじゃありません。","きょうは やすみじゃ ありません。","Kyou wa yasumi ja arimasen.","Today is not a day off."]],"昨日は雨でした。":[["昨日は私の誕生日でした。","きのうは わたしの たんじょうびでした。","Kinou wa watashi no tanjoubi deshita.","Yesterday was my birthday."],["テストは月曜日でした。","テストは げつようびでした。","Tesuto wa getsuyoubi deshita.","The test was on Monday."]]},"para":[[["田中さんは先生です。","たなかさんは せんせいです。","Tanaka-san wa sensei desu.","Mr. Tanaka is a teacher."],["あの人は医者です。","あの ひとは いしゃです。","Ano hito wa isha desu.","That person is a doctor."]],[["今日は日曜日です。","きょうは にちようびです。","Kyou wa nichiyoubi desu.","Today is Sunday."],["私の名前はアンッティです。","わたしの なまえは アンッティです。","Watashi no namae wa Antti desu.","My name is Antti."]],[["私は先生じゃありません。","わたしは せんせいじゃ ありません。","Watashi wa sensei ja arimasen.","I am not a teacher."],["昨日は休みでした。","きのうは やすみでした。","Kinou wa yasumi deshita.","Yesterday was a day off."]]]},{"title":"Questions with か and question words","pattern":"Statement + か。\nなに/なん (what) · だれ (who) · どこ (where) · いつ (when) · いくら (how much)","explanation":["Making a question in Japanese is easy: add か to the end of a normal sentence. The word order does not change. 学生です (I'm a student) → 学生ですか (Are you a student?). Your voice goes up a little on か.","Question words stand exactly where the answer will be. Q: これは何ですか (This is what?) → A: これは本です (This is a book). Just swap the question word for the answer.","何 is read なん before です, の and counters (何ですか, 何時), and なに before most other particles (何を食べますか)."],"tips":["Don't use a question mark instead of か in polite speech — か IS the question mark.","Answer はい (yes) / いいえ (no) and repeat the verb: 行きますか → はい、行きます。"],"examples":[["これは何ですか。","これは なんですか。","Kore wa nan desu ka?","What is this?","何 = なん before です"],["トイレはどこですか。","トイレは どこですか。","Toire wa doko desu ka?","Where is the toilet?","どこ = where"],["誕生日はいつですか。","たんじょうびは いつですか。","Tanjoubi wa itsu desu ka?","When is your birthday?","いつ = when"]],"more":{"これは何ですか。":[["それは何ですか。","それは なんですか。","Sore wa nan desu ka?","What is that?"],["あれは何ですか。","あれは なんですか。","Are wa nan desu ka?","What is that over there?"]],"トイレはどこですか。":[["駅はどこですか。","えきは どこですか。","Eki wa doko desu ka?","Where is the station?"],["出口はどこですか。","でぐちは どこですか。","Deguchi wa doko desu ka?","Where is the exit?"]],"誕生日はいつですか。":[["夏休みはいつですか。","なつやすみは いつですか。","Natsuyasumi wa itsu desu ka?","When is the summer holiday?"],["テストはいつですか。","テストは いつですか。","Tesuto wa itsu desu ka?","When is the test?"]]},"para":[[["学生ですか。","がくせいですか。","Gakusei desu ka?","Are you a student?"],["コーヒーを飲みますか。","コーヒーを のみますか。","Koohii o nomimasu ka?","Do you drink coffee?"]],[["これはいくらですか。","これは いくらですか。","Kore wa ikura desu ka?","How much is this?"],["会議はいつですか。","かいぎは いつですか。","Kaigi wa itsu desu ka?","When is the meeting?"]],[["今、何時ですか。","いま、なんじですか。","Ima, nanji desu ka?","What time is it now?"],["何を飲みますか。","なにを のみますか。","Nani o nomimasu ka?","What will you drink?"]]]},{"title":"これ・それ・あれ・どれ (this / that / that over there / which)","pattern":"これ・それ・あれ・どれ        (this one …)\nこの・その・あの・どの + noun  (this book …)\nここ・そこ・あそこ・どこ       (here, there …)","explanation":["Japanese has three 'distances': こ = near me (the speaker), そ = near you (the listener), あ = far from both of us. ど = the question 'which / where'.","これ/それ/あれ stand alone as nouns: これは本です (This is a book). この/その/あの must ALWAYS be followed by a noun: この本 (this book). You can't say この alone.","The same pattern gives places: ここ (here), そこ (there, near you), あそこ (over there), どこ (where?)."],"tips":["この alone is wrong — say これ, or この + noun.","Use それ for things near the other person, even if they're close to you too."],"examples":[["これは私のかばんです。","これは わたしの かばんです。","Kore wa watashi no kaban desu.","This is my bag.","これ = this one (near me)"],["あの人はだれですか。","あの ひとは だれですか。","Ano hito wa dare desu ka?","Who is that person over there?","あの + noun"],["駅はあそこです。","えきは あそこです。","Eki wa asoko desu.","The station is over there.","あそこ = over there"]],"more":{"これは私のかばんです。":[["それは田中さんのかさです。","それは たなかさんの かさです。","Sore wa Tanaka-san no kasa desu.","That is Mr. Tanaka's umbrella."],["あれは私の車です。","あれは わたしの くるまです。","Are wa watashi no kuruma desu.","That over there is my car."]],"あの人はだれですか。":[["この人は私の兄です。","この ひとは わたしの あにです。","Kono hito wa watashi no ani desu.","This person is my older brother."],["どの人が先生ですか。","どの ひとが せんせいですか。","Dono hito ga sensei desu ka?","Which person is the teacher?"]],"駅はあそこです。":[["受付はここです。","うけつけは ここです。","Uketsuke wa koko desu.","The reception is here."],["私のうちはそこです。","わたしの うちは そこです。","Watashi no uchi wa soko desu.","My house is there."]]},"para":[[["これはペンです。","これは ペンです。","Kore wa pen desu.","This is a pen."],["それは何ですか。","それは なんですか。","Sore wa nan desu ka?","What is that (near you)?"]],[["この本はおもしろいです。","この ほんは おもしろいです。","Kono hon wa omoshiroi desu.","This book is interesting."],["その時計は高いですか。","その とけいは たかいですか。","Sono tokei wa takai desu ka?","Is that watch expensive?"]],[["トイレはあそこです。","トイレは あそこです。","Toire wa asoko desu.","The toilet is over there."],["ここは私の部屋です。","ここは わたしの へやです。","Koko wa watashi no heya desu.","This is my room."]]]}]],["🟢 Level 2 · Particles",[{"title":"は (topic) vs が (subject)","pattern":"Topic は … (what we're talking about)\nSubject が … (who/what does it — new or important information)","explanation":["は sets the scene: 'As for X…'. It marks something both people already know about. が points at WHO or WHAT — it puts the spotlight on new information.","Question words like だれ, 何, どこ can never take は — they always take が, and the answer keeps が too: だれが来ましたか → 田中さんが来ました.","Some expressions always use が for the thing: 好きです (like), きらいです (dislike), 上手です (good at), わかります (understand), あります/います (there is). So: 私は猫が好きです — 'As for me, cats are liked'."],"tips":["だれは… is always wrong — use だれが.","For likes and skills: 私は X が 好き/上手 です.","は can also show contrast: 肉は食べません = 'Meat, I don't eat (but other things I do)'."],"examples":[["私は猫が好きです。","わたしは ねこが すきです。","Watashi wa neko ga suki desu.","I like cats.","Topic は + thing が 好き"],["だれが来ましたか。","だれが きましたか。","Dare ga kimashita ka?","Who came?","Question word + が"],["田中さんが来ました。","たなかさんが きました。","Tanaka-san ga kimashita.","Mr. Tanaka came.","The answer also takes が"]],"more":{"私は猫が好きです。":[["私は犬が好きです。","わたしは いぬが すきです。","Watashi wa inu ga suki desu.","I like dogs."],["兄は魚がきらいです。","あには さかなが きらいです。","Ani wa sakana ga kirai desu.","My older brother dislikes fish."]],"だれが来ましたか。":[["だれが作りましたか。","だれが つくりましたか。","Dare ga tsukurimashita ka?","Who made it?"],["何が好きですか。","なにが すきですか。","Nani ga suki desu ka?","What do you like?"]],"田中さんが来ました。":[["母が作りました。","ははが つくりました。","Haha ga tsukurimashita.","My mother made it."],["すしが好きです。","すしが すきです。","Sushi ga suki desu.","I like sushi."]]},"para":[[["私は日本語が好きです。","わたしは にほんごが すきです。","Watashi wa nihongo ga suki desu.","I like Japanese."],["今日は天気がいいです。","きょうは てんきが いいです。","Kyou wa tenki ga ii desu.","The weather is nice today."]],[["何がいいですか。","なにが いいですか。","Nani ga ii desu ka?","What would be good?"],["どこが痛いですか。","どこが いたいですか。","Doko ga itai desu ka?","Where does it hurt?"]],[["私は料理が上手です。","わたしは りょうりが じょうずです。","Watashi wa ryouri ga jouzu desu.","I'm good at cooking."],["日本語がわかりますか。","にほんごが わかりますか。","Nihongo ga wakarimasu ka?","Do you understand Japanese?"]]]},{"title":"を, に, へ, で — object, goal, direction, place","pattern":"Object を + verb\nPlace/time に (to, at)\nPlace へ (towards)\nPlace で + action (at, in) · Tool で (by, with)","explanation":["を (read 'o') marks the direct object — the thing the action is done to: 本を読みます (read a book).","に marks a destination (学校に行きます — go TO school), an exact time (七時に起きます) and the place where something exists (部屋に猫がいます). へ (read 'e') also means 'towards' and can replace に with movement verbs.","で marks the place where an action HAPPENS (図書館で読みます — read AT the library) and the tool or means (バスで行きます — go BY bus, はしで食べます — eat WITH chopsticks).","Simple test: is something being DONE there? → で. Is something going there or simply existing there? → に."],"tips":["を is written with the special kana を but pronounced 'o'.","Days like 月曜日 take に, but 今日, 明日, 毎日 don't take any particle.","Don't mix up: 公園で遊びます (play in the park) vs 公園に行きます (go to the park)."],"examples":[["学校に行きます。","がっこうに いきます。","Gakkou ni ikimasu.","I go to school.","に = destination"],["図書館で本を読みます。","としょかんで ほんを よみます。","Toshokan de hon o yomimasu.","I read books at the library.","で = place of action, を = object"],["バスで会社に行きます。","バスで かいしゃに いきます。","Basu de kaisha ni ikimasu.","I go to work by bus.","で = means, に = goal"],["日曜日に映画を見ます。","にちようびに えいがを みます。","Nichiyoubi ni eiga o mimasu.","I watch a movie on Sunday.","に = point in time"]],"more":{"学校に行きます。":[["会社に行きます。","かいしゃに いきます。","Kaisha ni ikimasu.","I go to the office."],["家に帰ります。","いえに かえります。","Ie ni kaerimasu.","I go home."]],"図書館で本を読みます。":[["家で映画を見ます。","いえで えいがを みます。","Ie de eiga o mimasu.","I watch movies at home."],["カフェでコーヒーを飲みます。","カフェで コーヒーを のみます。","Kafe de koohii o nomimasu.","I drink coffee at a café."]],"バスで会社に行きます。":[["自転車で学校に行きます。","じてんしゃで がっこうに いきます。","Jitensha de gakkou ni ikimasu.","I go to school by bicycle."],["電車で空港に行きます。","でんしゃで くうこうに いきます。","Densha de kuukou ni ikimasu.","I go to the airport by train."]],"日曜日に映画を見ます。":[["土曜日に買い物をします。","どようびに かいものを します。","Doyoubi ni kaimono o shimasu.","I go shopping on Saturday."],["八時に家を出ます。","はちじに いえを でます。","Hachiji ni ie o demasu.","I leave home at eight."]]},"para":[[["水を飲みます。","みずを のみます。","Mizu o nomimasu.","I drink water."],["手紙を書きます。","てがみを かきます。","Tegami o kakimasu.","I write a letter."]],[["来週、東京へ行きます。","らいしゅう、とうきょうへ いきます。","Raishuu, Toukyou e ikimasu.","Next week I'm going to Tokyo."],["部屋に猫がいます。","へやに ねこが います。","Heya ni neko ga imasu.","There's a cat in the room."]],[["はしでご飯を食べます。","はしで ごはんを たべます。","Hashi de gohan o tabemasu.","I eat rice with chopsticks."],["レストランで昼ご飯を食べます。","レストランで ひるごはんを たべます。","Resutoran de hirugohan o tabemasu.","I eat lunch at a restaurant."]],[["公園で遊びます。","こうえんで あそびます。","Kouen de asobimasu.","I play in the park."],["公園に行きます。","こうえんに いきます。","Kouen ni ikimasu.","I go to the park."]]]},{"title":"の, と, も — of, and, also","pattern":"A の B   (A's B / B of A)\nA と B   (A and B — complete list)\nX も     (X too / also — replaces は, が, を)","explanation":["の links two nouns, and the 'owner' or describing noun comes FIRST: 私の本 (my book), 日本の車 (a Japanese car), 日本語の先生 (a Japanese-language teacher).","と joins nouns into a complete list: パンと卵 (bread and eggs). It only joins NOUNS — never sentences. と also means 'with (someone)': 友達と行きます.","も means 'too / also'. It REPLACES は, が and を: 私は行きます → 私も行きます (I'm going too). With other particles it comes after them: 東京にも行きました (I went to Tokyo too)."],"tips":["Order is reversed from English 'B of A': 母のかさ = mother's umbrella.","Don't write はも or をも — も replaces them."],"examples":[["これは母のかさです。","これは ははの かさです。","Kore wa haha no kasa desu.","This is my mother's umbrella.","Owner の thing"],["パンと卵を買いました。","パンと たまごを かいました。","Pan to tamago o kaimashita.","I bought bread and eggs.","Noun と noun"],["私も行きます。","わたしも いきます。","Watashi mo ikimasu.","I'm going too.","も replaces は"]],"more":{"これは母のかさです。":[["これは父の時計です。","これは ちちの とけいです。","Kore wa chichi no tokei desu.","This is my father's watch."],["それは先生の本です。","それは せんせいの ほんです。","Sore wa sensei no hon desu.","That is the teacher's book."]],"パンと卵を買いました。":[["りんごとバナナを買いました。","りんごと バナナを かいました。","Ringo to banana o kaimashita.","I bought apples and bananas."],["肉と野菜を食べました。","にくと やさいを たべました。","Niku to yasai o tabemashita.","I ate meat and vegetables."]],"私も行きます。":[["私も学生です。","わたしも がくせいです。","Watashi mo gakusei desu.","I'm a student too."],["コーヒーも飲みます。","コーヒーも のみます。","Koohii mo nomimasu.","I drink coffee too."]]},"para":[[["これは日本の車です。","これは にほんの くるまです。","Kore wa Nihon no kuruma desu.","This is a Japanese car."],["私の先生はやさしいです。","わたしの せんせいは やさしいです。","Watashi no sensei wa yasashii desu.","My teacher is kind."]],[["犬と猫がいます。","いぬと ねこが います。","Inu to neko ga imasu.","There's a dog and a cat."],["友達と映画を見ます。","ともだちと えいがを みます。","Tomodachi to eiga o mimasu.","I watch a movie with a friend."]],[["兄も学生です。","あにも がくせいです。","Ani mo gakusei desu.","My older brother is a student too."],["京都にも行きました。","きょうとにも いきました。","Kyouto ni mo ikimashita.","I went to Kyoto too."]]]},{"title":"から・まで — from … until","pattern":"A から B まで   (from A to/until B — time or place)\nPlace から来ました (came from …)","explanation":["から marks a starting point and まで an end point. They work for both time (九時から五時まで — from 9 to 5) and places (家から駅まで — from home to the station).","Like every particle, they come AFTER the word: 東京から = 'from Tokyo' (literally 'Tokyo from').","You can use either one alone: 九時から始まります (starts at 9), 五時まで働きます (work until 5)."],"tips":["まで = until (a limit); までに = by (a deadline) — learn までに later.","から after a sentence means 'because' — see Level 6."],"examples":[["九時から五時まで働きます。","くじから ごじまで はたらきます。","Kuji kara goji made hatarakimasu.","I work from nine to five.","Time から … まで"],["家から駅まで十分です。","いえから えきまで じゅっぷんです。","Ie kara eki made juppun desu.","It's ten minutes from my house to the station.","Place から … まで"],["東京から来ました。","とうきょうから きました。","Toukyou kara kimashita.","I came from Tokyo.","Place から 来ました"]],"more":{"九時から五時まで働きます。":[["八時から四時まで学校です。","はちじから よじまで がっこうです。","Hachiji kara yoji made gakkou desu.","School is from eight to four."],["一時から三時まで寝ました。","いちじから さんじまで ねました。","Ichiji kara sanji made nemashita.","I slept from one to three."]],"家から駅まで十分です。":[["駅から空港まで三十分です。","えきから くうこうまで さんじゅっぷんです。","Eki kara kuukou made sanjuppun desu.","It's thirty minutes from the station to the airport."],["ここから海まで遠いです。","ここから うみまで とおいです。","Koko kara umi made tooi desu.","It's far from here to the sea."]],"東京から来ました。":[["ヘルシンキから来ました。","ヘルシンキから きました。","Herushinki kara kimashita.","I came from Helsinki."],["母から手紙が来ました。","ははから てがみが きました。","Haha kara tegami ga kimashita.","A letter came from my mother."]]},"para":[[["月曜日から金曜日まで働きます。","げつようびから きんようびまで はたらきます。","Getsuyoubi kara kin'youbi made hatarakimasu.","I work from Monday to Friday."],["ここから駅まで歩きます。","ここから えきまで あるきます。","Koko kara eki made arukimasu.","I walk from here to the station."]],[["フィンランドから来ました。","フィンランドから きました。","Finrando kara kimashita.","I came from Finland."],["会社から電話しました。","かいしゃから でんわ しました。","Kaisha kara denwa shimashita.","I called from the office."]],[["授業は九時から始まります。","じゅぎょうは くじから はじまります。","Jugyou wa kuji kara hajimarimasu.","Class starts at nine."],["夜、十時まで勉強します。","よる、じゅうじまで べんきょう します。","Yoru, juuji made benkyou shimasu.","At night I study until ten."]]]},{"title":"Particle guide — which particle when?","pattern":"は  ·  What is it about? (the topic)\nが  ·  Who? (new information, question words, 好き / ある / いる)\nを  ·  What is the action done to?\nに  ·  Where to? · When exactly? · Where does it exist?   (へ = towards)\nで  ·  Where does the action happen? · By what / with what?\nと  ·  With whom? · A and B\nの  ·  Whose? · What kind?\nから … まで  ·  From … until\nも  ·  Too / also","explanation":["The big logic: a particle comes AFTER a word and tells you that word's JOB in the sentence — like a label stuck on its back. English puts little words in front (AT the station); Japanese puts the label behind: 駅で (station-at). So to choose a particle, ask: what job does this word do?","Who or what is it about? は marks the topic — something already known, 'as for…': 私は学生です. が points at WHO or WHAT when that is the new or important part, always after question words (だれが), and with 好き, 上手, ある and いる: 部屋に猫がいます.","What is the action done to? → を. If you can ask 'WHAT do you eat / read / buy?', the answer takes を: 本を読みます, コーヒーを飲みます.","Where? Ask yourself: does an ACTION happen there, or does something GO there or simply EXIST there? Action happens there → で (公園で遊びます). Going there or being there → に (公園に行きます, 公園に猫がいます). へ marks the direction you head towards and can replace に with going verbs: 日本へ行きます.","When? An exact clock time or day takes に: 七時に起きます, 日曜日に. Words that move with today — 今日, 明日, 毎日, 今 — take NO particle.","How, with what, with whom? The tool or way of doing something → で (バスで, はしで, 日本語で). The person you do it with → と (友達と). Whose or what kind → の joins two nouns, owner first: 兄の車, 日本の車.","From and until → から and まで. Also / too → も, which REPLACES は, が and を: 私も行きます. At the very end of a sentence: か makes a question, ね asks the listener to agree, よ tells them something new."],"tips":["Learn the question each particle answers: は what about? · が who? · を what? · に where to / when? · で where does it happen / by what? · と with whom? · の whose?","で or に? 'Is something being DONE there?' → で. 'Going there or just being there?' → に.","も replaces は, が and を, but comes after other particles: 東京にも行きました.","The particle always comes AFTER its word — 駅で, never 'de eki'."],"examples":[["私は駅で友達に会います。","わたしは えきで ともだちに あいます。","Watashi wa eki de tomodachi ni aimasu.","I meet a friend at the station.","は topic · で where it happens · に the person you meet"],["父は台所で料理を作ります。","ちちは だいどころで りょうりを つくります。","Chichi wa daidokoro de ryouri o tsukurimasu.","My father cooks in the kitchen.","は topic · で place of action · を object"],["部屋に猫がいます。","へやに ねこが います。","Heya ni neko ga imasu.","There is a cat in the room.","に where it exists · が what exists"],["日曜日に友達と公園へ行きます。","にちようびに ともだちと こうえんへ いきます。","Nichiyoubi ni tomodachi to kouen e ikimasu.","On Sunday I go to the park with a friend.","に time · と with whom · へ direction"],["兄の車で東京から大阪まで行きました。","あにの くるまで とうきょうから おおさかまで いきました。","Ani no kuruma de Toukyou kara Oosaka made ikimashita.","I went from Tokyo to Osaka in my older brother's car.","の owner · で means · から … まで"],["私もコーヒーが好きです。","わたしも コーヒーが すきです。","Watashi mo koohii ga suki desu.","I like coffee too.","も replaces は · 好き takes が"]],"more":{"私は駅で友達に会います。":[["私は図書館で先生に会いました。","わたしは としょかんで せんせいに あいました。","Watashi wa toshokan de sensei ni aimashita.","I met my teacher at the library."],["姉は駅で電車を待ちます。","あねは えきで でんしゃを まちます。","Ane wa eki de densha o machimasu.","My older sister waits for the train at the station."]],"父は台所で料理を作ります。":[],"部屋に猫がいます。":[["机の上に本があります。","つくえの うえに ほんが あります。","Tsukue no ue ni hon ga arimasu.","There is a book on the desk."]],"日曜日に友達と公園へ行きます。":[["土曜日に母とデパートへ行きました。","どようびに ははと デパートへ いきました。","Doyoubi ni haha to depaato e ikimashita.","On Saturday I went to the department store with my mother."]],"兄の車で東京から大阪まで行きました。":[],"私もコーヒーが好きです。":[]},"para":[[["駅で待ちます。","えきで まちます。","Eki de machimasu.","I wait at the station."],["駅に行きます。","えきに いきます。","Eki ni ikimasu.","I go to the station."]],[["私は学生です。","わたしは がくせいです。","Watashi wa gakusei desu.","I am a student."],["だれが来ますか。","だれが きますか。","Dare ga kimasu ka?","Who is coming?"]],[["コーヒーを飲みます。","コーヒーを のみます。","Koohii o nomimasu.","I drink coffee."],["新しいかばんを買いました。","あたらしい かばんを かいました。","Atarashii kaban o kaimashita.","I bought a new bag."]],[["公園で遊びます。","こうえんで あそびます。","Kouen de asobimasu.","I play in the park."],["公園に猫がいます。","こうえんに ねこが います。","Kouen ni neko ga imasu.","There is a cat in the park."]],[["七時に起きます。","しちじに おきます。","Shichiji ni okimasu.","I get up at seven."],["明日、映画を見ます。","あした、えいがを みます。","Ashita, eiga o mimasu.","Tomorrow I'll watch a movie."]],[["はしで食べます。","はしで たべます。","Hashi de tabemasu.","I eat with chopsticks."],["友達と話します。","ともだちと はなします。","Tomodachi to hanashimasu.","I talk with a friend."]],[["私も行きます。","わたしも いきます。","Watashi mo ikimasu.","I'm going too."],["おいしいですね。","おいしいですね。","Oishii desu ne.","It's delicious, isn't it?"]]]}]],["🟡 Level 3 · Verbs",[{"title":"Verb groups and the polite ます form","pattern":"Group 1 (u-verbs):   話す → 話します (う-sound → い-sound + ます)\nGroup 2 (ru-verbs):  食べる → 食べます (drop る + ます)\nGroup 3 (irregular): する → します · 来る → 来ます","explanation":["Every Japanese verb has a dictionary form ending in an 'u' sound: 話す (hanasu), 食べる (taberu), 行く (iku). To be polite, change it into the ます form.","Group 1 (u-verbs): change the last 'u' sound to the 'i' sound and add ます: 話す → 話します, 飲む → 飲みます, 行く → 行きます, 帰る → 帰ります.","Group 2 (ru-verbs): most verbs ending in -iru / -eru. Just drop る and add ます: 食べる → 食べます, 見る → 見ます, 寝る → 寝ます.","Group 3: only two irregular verbs — する (do) → します and 来る (come) → 来ます (きます). Many nouns become verbs with します: 勉強します, 料理します."],"tips":["帰る, 入る, 走る look like ru-verbs but are Group 1: 帰ります.","The ます form is also used for the future: 明日行きます = I will go tomorrow."],"examples":[["毎日、日本語を話します。","まいにち、にほんごを はなします。","Mainichi, nihongo o hanashimasu.","I speak Japanese every day.","話す → 話します (Group 1)"],["夜は早く寝ます。","よるは はやく ねます。","Yoru wa hayaku nemasu.","I go to bed early at night.","寝る → 寝ます (Group 2)"],["友達が家に来ます。","ともだちが いえに きます。","Tomodachi ga ie ni kimasu.","A friend is coming to my house.","来る → 来ます (Group 3)"]],"more":{"毎日、日本語を話します。":[["毎日、英語を話します。","まいにち、えいごを はなします。","Mainichi, eigo o hanashimasu.","I speak English every day."],["毎日、母に電話します。","まいにち、ははに でんわ します。","Mainichi, haha ni denwa shimasu.","I call my mother every day."]],"夜は早く寝ます。":[["朝は早く起きます。","あさは はやく おきます。","Asa wa hayaku okimasu.","In the morning I get up early."],["週末は遅く寝ます。","しゅうまつは おそく ねます。","Shuumatsu wa osoku nemasu.","On weekends I go to bed late."]],"友達が家に来ます。":[["先生が教室に来ます。","せんせいが きょうしつに きます。","Sensei ga kyoushitsu ni kimasu.","The teacher comes to the classroom."],["明日、兄が来ます。","あした、あにが きます。","Ashita, ani ga kimasu.","My older brother is coming tomorrow."]]},"para":[[["音楽を聞きます。","おんがくを ききます。","Ongaku o kikimasu.","I listen to music. (聞く → 聞きます)"],["毎晩、本を読みます。","まいばん、ほんを よみます。","Maiban, hon o yomimasu.","I read a book every evening. (読む → 読みます)"]],[["駅で待ちます。","えきで まちます。","Eki de machimasu.","I'll wait at the station. (待つ → 待ちます)"],["七時に家に帰ります。","しちじに いえに かえります。","Shichiji ni ie ni kaerimasu.","I go home at seven. (帰る → 帰ります)"]],[["テレビを見ます。","テレビを みます。","Terebi o mimasu.","I watch TV. (見る → 見ます)"],["六時に起きます。","ろくじに おきます。","Rokuji ni okimasu.","I get up at six. (起きる → 起きます)"]],[["毎晩、料理します。","まいばん、りょうり します。","Maiban, ryouri shimasu.","I cook every evening. (料理 + します)"],["明日、友達が来ます。","あした、ともだちが きます。","Ashita, tomodachi ga kimasu.","A friend is coming tomorrow. (来る → 来ます)"]]]},{"title":"Past and negative: ました・ません・ませんでした","pattern":"～ます      (do / will do)\n～ません    (don't / won't)\n～ました    (did)\n～ませんでした (didn't)","explanation":["Once you know the ます form, the other polite forms are just new endings on the same stem: 食べます → 食べません (don't eat) → 食べました (ate) → 食べませんでした (didn't eat).","Japanese has no separate future tense. 食べます means both 'I eat' and 'I will eat' — time words like 明日 (tomorrow) make it clear.","Use は instead of を for contrast in negative sentences: 肉は食べません — 'Meat, I don't eat'. It sounds more natural than 肉を食べません."],"tips":["ませんでした is ONE ending — don't say ましたません.","Time words like 昨日 and 今日 usually don't take に."],"examples":[["昨日、映画を見ました。","きのう、えいがを みました。","Kinou, eiga o mimashita.","I watched a movie yesterday.","Past: ました"],["今日は肉を食べません。","きょうは にくを たべません。","Kyou wa niku o tabemasen.","I won't eat meat today.","Negative: ません"],["朝ご飯を食べませんでした。","あさごはんを たべませんでした。","Asagohan o tabemasen deshita.","I didn't eat breakfast.","Past negative: ませんでした"]],"more":{"昨日、映画を見ました。":[["昨日、友達に会いました。","きのう、ともだちに あいました。","Kinou, tomodachi ni aimashita.","I met a friend yesterday."],["先週、京都へ行きました。","せんしゅう、きょうとへ いきました。","Senshuu, Kyouto e ikimashita.","Last week I went to Kyoto."]],"今日は肉を食べません。":[["今日は学校に行きません。","きょうは がっこうに いきません。","Kyou wa gakkou ni ikimasen.","I'm not going to school today."],["朝はコーヒーを飲みません。","あさは コーヒーを のみません。","Asa wa koohii o nomimasen.","I don't drink coffee in the morning."]],"朝ご飯を食べませんでした。":[["昨日は勉強しませんでした。","きのうは べんきょう しませんでした。","Kinou wa benkyou shimasen deshita.","I didn't study yesterday."],["週末は出かけませんでした。","しゅうまつは でかけませんでした。","Shuumatsu wa dekakemasen deshita.","I didn't go out at the weekend."]]},"para":[[["昨日、ケーキを食べました。","きのう、ケーキを たべました。","Kinou, keeki o tabemashita.","I ate cake yesterday."],["お酒は飲みません。","おさけは のみません。","Osake wa nomimasen.","I don't drink alcohol."]],[["明日、映画を見ます。","あした、えいがを みます。","Ashita, eiga o mimasu.","I will watch a movie tomorrow."],["来年、日本へ行きます。","らいねん、にほんへ いきます。","Rainen, Nihon e ikimasu.","Next year I will go to Japan."]],[["たばこは吸いません。","たばこは すいません。","Tabako wa suimasen.","I don't smoke."],["テレビはあまり見ません。","テレビは あまり みません。","Terebi wa amari mimasen.","I don't watch TV much."]]]},{"title":"あります vs います — there is / to have","pattern":"Place に + thing が あります  (things, plants)\nPlace に + person/animal が います  (living, moving beings)","explanation":["Japanese has two verbs for 'there is'. あります is for objects, plants and events; います is for people and animals — anything that moves by itself.","The usual order is: place に → thing が → あります/います. 机の上に本があります = 'On the desk, there is a book'.","These verbs also mean 'to have': 時間があります (I have time), 兄弟がいます (I have siblings).","Position words use の: 机の上 (on top of the desk), 箱の中 (inside the box), 駅の前 (in front of the station)."],"tips":["A taxi or robot uses あります; a person or cat uses います.","Negative: ありません / いません."],"examples":[["机の上に本があります。","つくえの うえに ほんが あります。","Tsukue no ue ni hon ga arimasu.","There is a book on the desk.","Things → あります"],["公園に子供がいます。","こうえんに こどもが います。","Kouen ni kodomo ga imasu.","There are children in the park.","People → います"],["兄弟がいますか。","きょうだいが いますか。","Kyoudai ga imasu ka?","Do you have brothers or sisters?","います = to have (people)"]],"more":{"机の上に本があります。":[["かばんの中にペンがあります。","かばんの なかに ペンが あります。","Kaban no naka ni pen ga arimasu.","There's a pen in the bag."],["部屋にテレビがあります。","へやに テレビが あります。","Heya ni terebi ga arimasu.","There's a TV in the room."]],"公園に子供がいます。":[["駅に友達がいます。","えきに ともだちが います。","Eki ni tomodachi ga imasu.","My friend is at the station."],["木の上に鳥がいます。","きの うえに とりが います。","Ki no ue ni tori ga imasu.","There's a bird in the tree."]],"兄弟がいますか。":[["ペットがいますか。","ペットが いますか。","Petto ga imasu ka?","Do you have a pet?"],["時間がありますか。","じかんが ありますか。","Jikan ga arimasu ka?","Do you have time?"]]},"para":[[["テーブルの上に花があります。","テーブルの うえに はなが あります。","Teeburu no ue ni hana ga arimasu.","There are flowers on the table."],["庭に犬がいます。","にわに いぬが います。","Niwa ni inu ga imasu.","There's a dog in the garden."]],[["駅の前に銀行があります。","えきの まえに ぎんこうが あります。","Eki no mae ni ginkou ga arimasu.","There's a bank in front of the station."],["教室に学生がいます。","きょうしつに がくせいが います。","Kyoushitsu ni gakusei ga imasu.","There are students in the classroom."]],[["お金がありません。","おかねが ありません。","Okane ga arimasen.","I have no money."],["妹が二人います。","いもうとが ふたり います。","Imouto ga futari imasu.","I have two younger sisters."]],[["箱の中に何がありますか。","はこの なかに なにが ありますか。","Hako no naka ni nani ga arimasu ka?","What is inside the box?"],["机の下に猫がいます。","つくえの したに ねこが います。","Tsukue no shita ni neko ga imasu.","There's a cat under the desk."]]]},{"title":"The て-form and ～ています (ongoing actions and states)","pattern":"Verb て-form + います\nGroup 1: う/つ/る → って · む/ぶ/ぬ → んで · く → いて · ぐ → いで · す → して\nGroup 2: る → て · する → して · 来る → 来て · 行く → 行って","explanation":["The て-form is the most important verb form after ます — it's used to connect actions, make requests and much more. Group 2 is easy: 食べる → 食べて. Group 1 depends on the last sound: 待つ → 待って, 飲む → 飲んで, 書く → 書いて, 話す → 話して. 行く is special: 行って.","て-form + います describes an action happening right now: 雨が降っています (it is raining). It's like English '-ing'.","It also describes a lasting state or habit: 銀行で働いています (works at a bank), ヘルシンキに住んでいます (lives in Helsinki), 結婚しています (is married)."],"tips":["In speech the い of います is often dropped: 降ってます.","住んでいます, not 住みます, for 'I live in…'."],"examples":[["今、雨が降っています。","いま、あめが ふって います。","Ima, ame ga futte imasu.","It's raining now.","Action happening now"],["姉は銀行で働いています。","あねは ぎんこうで はたらいて います。","Ane wa ginkou de hataraite imasu.","My older sister works at a bank.","Lasting situation"],["ヘルシンキに住んでいます。","ヘルシンキに すんで います。","Herushinki ni sunde imasu.","I live in Helsinki.","住む → 住んで"]],"more":{"今、雨が降っています。":[["今、雪が降っています。","いま、ゆきが ふって います。","Ima, yuki ga futte imasu.","It's snowing now."],["今、ご飯を食べています。","いま、ごはんを たべて います。","Ima, gohan o tabete imasu.","I'm eating now."]],"姉は銀行で働いています。":[["父は病院で働いています。","ちちは びょういんで はたらいて います。","Chichi wa byouin de hataraite imasu.","My father works at a hospital."],["兄は大学で勉強しています。","あには だいがくで べんきょう して います。","Ani wa daigaku de benkyou shite imasu.","My older brother studies at university."]],"ヘルシンキに住んでいます。":[["東京に住んでいます。","とうきょうに すんで います。","Toukyou ni sunde imasu.","I live in Tokyo."],["両親はフィンランドに住んでいます。","りょうしんは フィンランドに すんで います。","Ryoushin wa Finrando ni sunde imasu.","My parents live in Finland."]]},"para":[[["ちょっと待ってください。","ちょっと まって ください。","Chotto matte kudasai.","Please wait a moment. (待つ → 待って)"],["朝起きて、顔を洗います。","あさ おきて、かおを あらいます。","Asa okite, kao o araimasu.","In the morning I get up and wash my face."]],[["今、本を読んでいます。","いま、ほんを よんで います。","Ima, hon o yonde imasu.","I'm reading a book now."],["子供が公園で遊んでいます。","こどもが こうえんで あそんで います。","Kodomo ga kouen de asonde imasu.","The children are playing in the park."]],[["兄は結婚しています。","あには けっこん して います。","Ani wa kekkon shite imasu.","My older brother is married."],["父は車を持っています。","ちちは くるまを もって います。","Chichi wa kuruma o motte imasu.","My father has a car."]]]}]],["🟡 Level 4 · Adjectives",[{"title":"い-adjectives and な-adjectives","pattern":"い-adj:  広い 部屋 · 部屋は 広いです\nな-adj:  静かな 町 · 町は 静かです","explanation":["Japanese has two kinds of adjectives. い-adjectives end in い: 大きい (big), 高い (expensive / tall), おもしろい (interesting). な-adjectives need な before a noun: 静かな町 (a quiet town), きれいな花 (a pretty flower).","Before a noun: い-adjectives go straight in (広い部屋), な-adjectives add な (静かな町). Adjectives ALWAYS come before the noun they describe.","At the end of a sentence: both just add です — 広いです, 静かです (no な here)."],"tips":["きれい and きらい end in い but are な-adjectives: きれいな部屋.","いい (good) is irregular: its negative is よくない and past よかった."],"examples":[["この部屋は広いです。","この へやは ひろいです。","Kono heya wa hiroi desu.","This room is spacious.","い-adjective + です"],["静かな町です。","しずかな まちです。","Shizuka na machi desu.","It's a quiet town.","な-adjective + な + noun"],["日本語はおもしろいです。","にほんごは おもしろいです。","Nihongo wa omoshiroi desu.","Japanese is interesting.","Topic は + adjective"]],"more":{"この部屋は広いです。":[["このかばんは重いです。","この かばんは おもいです。","Kono kaban wa omoi desu.","This bag is heavy."],["あの山は高いです。","あの やまは たかいです。","Ano yama wa takai desu.","That mountain is high."]],"静かな町です。":[["にぎやかな町です。","にぎやかな まちです。","Nigiyaka na machi desu.","It's a lively town."],["元気な子供です。","げんきな こどもです。","Genki na kodomo desu.","It's an energetic child."]],"日本語はおもしろいです。":[["漢字は難しいです。","かんじは むずかしいです。","Kanji wa muzukashii desu.","Kanji is difficult."],["ひらがなは簡単です。","ひらがなは かんたんです。","Hiragana wa kantan desu.","Hiragana is easy."]]},"para":[[["大きい犬です。","おおきい いぬです。","Ookii inu desu.","It's a big dog."],["きれいな花です。","きれいな はなです。","Kirei na hana desu.","It's a pretty flower."]],[["新しい車を買いました。","あたらしい くるまを かいました。","Atarashii kuruma o kaimashita.","I bought a new car."],["有名な店です。","ゆうめいな みせです。","Yuumei na mise desu.","It's a famous shop."]],[["この料理はおいしいです。","この りょうりは おいしいです。","Kono ryouri wa oishii desu.","This dish is delicious."],["図書館は静かです。","としょかんは しずかです。","Toshokan wa shizuka desu.","The library is quiet."]]]},{"title":"Adjective negative and past","pattern":"い-adj:  寒い → 寒くないです · 寒かったです · 寒くなかったです\nな-adj:  きれい → きれいじゃありません · きれいでした","explanation":["い-adjectives change their own ending. Negative: replace い with くない (寒い → 寒くない). Past: replace い with かった (楽しい → 楽しかった). Past negative: くなかった. Then add です to be polite.","な-adjectives behave like nouns: きれいです → きれいじゃありません (not clean) → きれいでした (was clean) → きれいじゃありませんでした.","Never put でした after an い-adjective: 楽しいでした is a very common mistake — say 楽しかったです."],"tips":["楽しいでした ✗ → 楽しかったです ✓","いい → よくないです / よかったです."],"examples":[["今日は寒くないです。","きょうは さむくないです。","Kyou wa samukunai desu.","It isn't cold today.","い → くない"],["旅行は楽しかったです。","りょこうは たのしかったです。","Ryokou wa tanoshikatta desu.","The trip was fun.","い → かった"],["この店はきれいじゃありません。","この みせは きれいじゃ ありません。","Kono mise wa kirei ja arimasen.","This shop isn't clean.","な-adjective negative"]],"more":{"今日は寒くないです。":[["この部屋は暑くないです。","この へやは あつくないです。","Kono heya wa atsukunai desu.","This room isn't hot."],["駅は遠くないです。","えきは とおくないです。","Eki wa tookunai desu.","The station isn't far."]],"旅行は楽しかったです。":[["テストは難しかったです。","テストは むずかしかったです。","Tesuto wa muzukashikatta desu.","The test was difficult."],["ラーメンはおいしかったです。","ラーメンは おいしかったです。","Raamen wa oishikatta desu.","The ramen was delicious."]],"この店はきれいじゃありません。":[["この部屋は静かじゃありません。","この へやは しずかじゃ ありません。","Kono heya wa shizuka ja arimasen.","This room isn't quiet."],["私は料理が上手じゃありません。","わたしは りょうりが じょうずじゃ ありません。","Watashi wa ryouri ga jouzu ja arimasen.","I'm not good at cooking."]]},"para":[[["この本は高くないです。","この ほんは たかくないです。","Kono hon wa takakunai desu.","This book isn't expensive."],["昨日は暑かったです。","きのうは あつかったです。","Kinou wa atsukatta desu.","It was hot yesterday."]],[["この町は静かじゃありません。","この まちは しずかじゃ ありません。","Kono machi wa shizuka ja arimasen.","This town isn't quiet."],["昨日は暇でした。","きのうは ひまでした。","Kinou wa hima deshita.","I was free yesterday."]],[["パーティーは楽しかったです。","パーティーは たのしかったです。","Paatii wa tanoshikatta desu.","The party was fun."],["映画はおもしろかったです。","えいがは おもしろかったです。","Eiga wa omoshirokatta desu.","The movie was interesting."]]]}]],["🟠 Level 5 · Requests, wishes & invitations",[{"title":"～てください — asking someone to do something","pattern":"Verb て-form + ください  (please do …)","explanation":["To ask someone politely to do something, use the て-form of the verb + ください: 待つ → 待って → 待ってください (please wait).","The object and other details come before the verb as usual: ここに名前を書いてください (please write your name here).","Add もう少し (a little more) or ちょっと to make requests softer and more natural."],"tips":["Thing を ください = 'give me (a thing)'; verb て ください = 'please do'.","For a negative request use ～ないでください (please don't…) — learn this next."],"examples":[["ここに名前を書いてください。","ここに なまえを かいて ください。","Koko ni namae o kaite kudasai.","Please write your name here.","書く → 書いて"],["窓を開けてください。","まどを あけて ください。","Mado o akete kudasai.","Please open the window.","開ける → 開けて"],["もう少しゆっくり話してください。","もう すこし ゆっくり はなして ください。","Mou sukoshi yukkuri hanashite kudasai.","Please speak a little more slowly.","Softened with もう少し"]],"more":{"ここに名前を書いてください。":[["ここに電話番号を書いてください。","ここに でんわばんごうを かいて ください。","Koko ni denwa bangou o kaite kudasai.","Please write your phone number here."],["名前をもう一度言ってください。","なまえを もう いちど いって ください。","Namae o mou ichido itte kudasai.","Please say your name once more."]],"窓を開けてください。":[["ドアを閉めてください。","ドアを しめて ください。","Doa o shimete kudasai.","Please close the door."],["電気をつけてください。","でんきを つけて ください。","Denki o tsukete kudasai.","Please turn on the light."]],"もう少しゆっくり話してください。":[["もう一度言ってください。","もう いちど いって ください。","Mou ichido itte kudasai.","Please say it once more."],["英語で説明してください。","えいごで せつめい して ください。","Eigo de setsumei shite kudasai.","Please explain in English."]]},"para":[[["ここで待ってください。","ここで まって ください。","Koko de matte kudasai.","Please wait here."],["これを見てください。","これを みて ください。","Kore o mite kudasai.","Please look at this."]],[["ここに住所を書いてください。","ここに じゅうしょを かいて ください。","Koko ni juusho o kaite kudasai.","Please write your address here."],["駅の前で止めてください。","えきの まえで とめて ください。","Eki no mae de tomete kudasai.","Please stop in front of the station."]],[["もう少し大きい声で話してください。","もう すこし おおきい こえで はなして ください。","Mou sukoshi ookii koe de hanashite kudasai.","Please speak a little louder."],["ちょっと手伝ってください。","ちょっと てつだって ください。","Chotto tetsudatte kudasai.","Please help me a little."]]]},{"title":"～たい (want to do) and ～がほしい (want a thing)","pattern":"Verb stem + たいです      (I want to …)\nThing が ほしいです       (I want …)","explanation":["To say you want to DO something, take the ます-stem (食べます → 食べ) and add たい: 食べたいです (I want to eat), 行きたいです (I want to go).","たい works like an い-adjective: 行きたくないです (don't want to go), 行きたかったです (wanted to go).","To want a THING, use ほしい with が: 新しいパソコンがほしいです (I want a new computer)."],"tips":["Use たい / ほしい only about yourself (or to ask 'do you want?').","With たい, を can become が: 水が飲みたいです is also natural."],"examples":[["日本へ行きたいです。","にほんへ いきたいです。","Nihon e ikitai desu.","I want to go to Japan.","行きます → 行きたい"],["新しいパソコンがほしいです。","あたらしい パソコンが ほしいです。","Atarashii pasokon ga hoshii desu.","I want a new computer.","Thing が ほしい"],["何を食べたいですか。","なにを たべたいですか。","Nani o tabetai desu ka?","What do you want to eat?","Question with たい"]],"more":{"日本へ行きたいです。":[["京都へ行きたいです。","きょうとへ いきたいです。","Kyouto e ikitai desu.","I want to go to Kyoto."],["富士山に登りたいです。","ふじさんに のぼりたいです。","Fujisan ni noboritai desu.","I want to climb Mt. Fuji."]],"新しいパソコンがほしいです。":[["大きい車がほしいです。","おおきい くるまが ほしいです。","Ookii kuruma ga hoshii desu.","I want a big car."],["猫がほしいです。","ねこが ほしいです。","Neko ga hoshii desu.","I want a cat."]],"何を食べたいですか。":[["どこへ行きたいですか。","どこへ いきたいですか。","Doko e ikitai desu ka?","Where do you want to go?"],["何を飲みたいですか。","なにを のみたいですか。","Nani o nomitai desu ka?","What do you want to drink?"]]},"para":[[["すしを食べたいです。","すしを たべたいです。","Sushi o tabetai desu.","I want to eat sushi."],["日本語を勉強したいです。","にほんごを べんきょう したいです。","Nihongo o benkyou shitai desu.","I want to study Japanese."]],[["今日は出かけたくないです。","きょうは でかけたくないです。","Kyou wa dekaketakunai desu.","I don't want to go out today."],["子供の時、先生になりたかったです。","こどもの とき、せんせいに なりたかったです。","Kodomo no toki, sensei ni naritakatta desu.","As a child, I wanted to become a teacher."]],[["新しい靴がほしいです。","あたらしい くつが ほしいです。","Atarashii kutsu ga hoshii desu.","I want new shoes."],["時間がほしいです。","じかんが ほしいです。","Jikan ga hoshii desu.","I want more time."]]]},{"title":"Invitations: ～ませんか and ～ましょう","pattern":"～ませんか   (Won't you …? — polite invitation)\n～ましょう   (Let's …)\n～ましょうか (Shall we / Shall I …?)","explanation":["To invite someone politely, use the negative question ～ませんか: 一緒に映画を見ませんか — literally 'Won't you watch a movie together?'. It sounds softer than a direct question.","～ましょう means 'let's': 休みましょう (let's rest). Use it when you both already agree, or to accept an invitation: いいですね、行きましょう！","～ましょうか offers or suggests: 駅で会いましょうか (Shall we meet at the station?), 手伝いましょうか (Shall I help?)."],"tips":["Answer an invitation with いいですね (sounds good) or ちょっと… (politely: not possible).","一緒に (together) often goes with these forms."],"examples":[["一緒に映画を見ませんか。","いっしょに えいがを みませんか。","Issho ni eiga o mimasen ka?","Would you like to watch a movie together?","Invitation ～ませんか"],["少し休みましょう。","すこし やすみましょう。","Sukoshi yasumimashou.","Let's take a little rest.","Let's ～ましょう"],["駅で会いましょうか。","えきで あいましょうか。","Eki de aimashou ka?","Shall we meet at the station?","Suggestion ～ましょうか"]],"more":{"一緒に映画を見ませんか。":[["一緒にコーヒーを飲みませんか。","いっしょに コーヒーを のみませんか。","Issho ni koohii o nomimasen ka?","Would you like to have a coffee together?"],["明日、テニスをしませんか。","あした、テニスを しませんか。","Ashita, tenisu o shimasen ka?","Would you like to play tennis tomorrow?"]],"少し休みましょう。":[["早く帰りましょう。","はやく かえりましょう。","Hayaku kaerimashou.","Let's go home early."],["ここで写真を撮りましょう。","ここで しゃしんを とりましょう。","Koko de shashin o torimashou.","Let's take a photo here."]],"駅で会いましょうか。":[["何時に会いましょうか。","なんじに あいましょうか。","Nanji ni aimashou ka?","What time shall we meet?"],["タクシーを呼びましょうか。","タクシーを よびましょうか。","Takushii o yobimashou ka?","Shall I call a taxi?"]]},"para":[[["一緒に昼ご飯を食べませんか。","いっしょに ひるごはんを たべませんか。","Issho ni hirugohan o tabemasen ka?","Would you like to have lunch together?"],["週末、海に行きませんか。","しゅうまつ、うみに いきませんか。","Shuumatsu, umi ni ikimasen ka?","Would you like to go to the sea this weekend?"]],[["いいですね。行きましょう！","いいですね。いきましょう！","Ii desu ne. Ikimashou!","Sounds good. Let's go!"],["さあ、始めましょう。","さあ、はじめましょう。","Saa, hajimemashou.","Well then, let's begin."]],[["手伝いましょうか。","てつだいましょうか。","Tetsudaimashou ka?","Shall I help you?"],["窓を開けましょうか。","まどを あけましょうか。","Mado o akemashou ka?","Shall I open the window?"]]]}]],["🔴 Level 6 · Advanced N5 patterns",[{"title":"Permission and rules: ～てもいいです / ～てはいけません","pattern":"Verb て-form + もいいですか   (May I …?)\nVerb て-form + もいいです     (You may …)\nVerb て-form + はいけません   (You must not …)","explanation":["To ask permission, use the て-form + もいいですか: 写真を撮ってもいいですか (May I take a photo?). Literally 'even if I take a photo, is it good?'.","To give permission, drop か: 開けてもいいですよ (You may open it). よ at the end makes it friendly.","To forbid something, use て-form + はいけません: ここで吸ってはいけません (You must not smoke here). You'll see this on signs and hear it from teachers."],"tips":["Answer 'May I…?' with はい、どうぞ (yes, go ahead) or すみません、ちょっと… (sorry, no).","In speech ～ては often becomes ～ちゃ: 吸っちゃいけません."],"examples":[["写真を撮ってもいいですか。","しゃしんを とっても いいですか。","Shashin o totte mo ii desu ka?","May I take a photo?","Asking permission"],["ここでたばこを吸ってはいけません。","ここで たばこを すっては いけません。","Koko de tabako o sutte wa ikemasen.","You must not smoke here.","Prohibition"],["窓を開けてもいいですよ。","まどを あけても いいですよ。","Mado o akete mo ii desu yo.","You may open the window.","Giving permission"]],"more":{"写真を撮ってもいいですか。":[["窓を開けてもいいですか。","まどを あけても いいですか。","Mado o akete mo ii desu ka?","May I open the window?"],["これを食べてもいいですか。","これを たべても いいですか。","Kore o tabete mo ii desu ka?","May I eat this?"]],"ここでたばこを吸ってはいけません。":[["ここに車を止めてはいけません。","ここに くるまを とめては いけません。","Koko ni kuruma o tomete wa ikemasen.","You must not park here."],["図書館で食べてはいけません。","としょかんで たべては いけません。","Toshokan de tabete wa ikemasen.","You must not eat in the library."]],"窓を開けてもいいですよ。":[["このペンを使ってもいいですよ。","この ペンを つかっても いいですよ。","Kono pen o tsukatte mo ii desu yo.","You may use this pen."],["先に食べてもいいですよ。","さきに たべても いいですよ。","Saki ni tabete mo ii desu yo.","You may start eating first."]]},"para":[[["ここに座ってもいいですか。","ここに すわっても いいですか。","Koko ni suwatte mo ii desu ka?","May I sit here?"],["トイレを使ってもいいですか。","トイレを つかっても いいですか。","Toire o tsukatte mo ii desu ka?","May I use the toilet?"]],[["はい、どうぞ。使ってもいいですよ。","はい、どうぞ。つかっても いいですよ。","Hai, douzo. Tsukatte mo ii desu yo.","Yes, go ahead. You may use it."],["もう帰ってもいいですよ。","もう かえっても いいですよ。","Mou kaette mo ii desu yo.","You may go home now."]],[["ここで写真を撮ってはいけません。","ここで しゃしんを とっては いけません。","Koko de shashin o totte wa ikemasen.","You must not take photos here."],["授業中に話してはいけません。","じゅぎょうちゅうに はなしては いけません。","Jugyouchuu ni hanashite wa ikemasen.","You must not talk during class."]]]},{"title":"Order of actions: ～てから・～前に・～た後で","pattern":"Verb て-form + から   (after doing …, then)\nVerb dictionary form + 前に   (before doing …)\nNoun の 前に / Noun の 後で   (before / after …)","explanation":["て-form + から means 'after doing A, (then) B': 手を洗ってから、ご飯を食べます (I wash my hands, then eat). The first action must finish before the second.","Dictionary form + 前に means 'before doing': 寝る前に本を読みます (I read before I sleep). The verb before 前に is ALWAYS in dictionary form, even if the sentence is past.","With nouns use の: 仕事の前に (before work), 仕事の後で (after work)."],"tips":["寝ます前に ✗ → 寝る前に ✓ (dictionary form).","The main verb at the end decides the tense of the whole sentence."],"examples":[["手を洗ってから、ご飯を食べます。","てを あらって から、ごはんを たべます。","Te o aratte kara, gohan o tabemasu.","I wash my hands and then eat.","て-form + から"],["寝る前に本を読みます。","ねる まえに ほんを よみます。","Neru mae ni hon o yomimasu.","I read a book before going to sleep.","Dictionary form + 前に"],["仕事の後で、ジムに行きます。","しごとの あとで、ジムに いきます。","Shigoto no ato de, jimu ni ikimasu.","After work, I go to the gym.","Noun の 後で"]],"more":{"手を洗ってから、ご飯を食べます。":[["家に帰ってから、勉強します。","いえに かえって から、べんきょう します。","Ie ni kaette kara, benkyou shimasu.","After I get home, I study."],["電話してから、行きます。","でんわ して から、いきます。","Denwa shite kara, ikimasu.","I'll call first, then go."]],"寝る前に本を読みます。":[["出かける前に、窓を閉めます。","でかける まえに、まどを しめます。","Dekakeru mae ni, mado o shimemasu.","I close the windows before going out."],["寝る前に歯をみがきます。","ねる まえに はを みがきます。","Neru mae ni ha o migakimasu.","I brush my teeth before bed."]],"仕事の後で、ジムに行きます。":[["学校の後で、友達と遊びます。","がっこうの あとで、ともだちと あそびます。","Gakkou no ato de, tomodachi to asobimasu.","After school, I play with friends."],["映画の後で、ご飯を食べましょう。","えいがの あとで、ごはんを たべましょう。","Eiga no ato de, gohan o tabemashou.","Let's eat after the movie."]]},"para":[[["宿題をしてから、遊びます。","しゅくだいを して から、あそびます。","Shukudai o shite kara, asobimasu.","I do my homework and then play."],["シャワーを浴びてから、寝ます。","シャワーを あびて から、ねます。","Shawaa o abite kara, nemasu.","I take a shower and then go to bed."]],[["食べる前に、手を洗います。","たべる まえに、てを あらいます。","Taberu mae ni, te o araimasu.","I wash my hands before eating."],["日本へ行く前に、日本語を勉強しました。","にほんへ いく まえに、にほんごを べんきょう しました。","Nihon e iku mae ni, nihongo o benkyou shimashita.","Before going to Japan, I studied Japanese."]],[["授業の前に、コーヒーを飲みます。","じゅぎょうの まえに、コーヒーを のみます。","Jugyou no mae ni, koohii o nomimasu.","I drink coffee before class."],["食事の後で、散歩します。","しょくじの あとで、さんぽ します。","Shokuji no ato de, sanpo shimasu.","After the meal, I take a walk."]]]},{"title":"Reasons and contrasts: ～から (because) and ～が / でも (but)","pattern":"Reason + から、result。      (because …, so …)\nSentence A + が、sentence B。 (A, but B)\nSentence A。でも、sentence B。 (A. But B.)","explanation":["から after a sentence means 'because / so'. The REASON comes first, then the result — the opposite of English 'I'll take a taxi because it's raining': 雨ですから、タクシーで行きます.","が after a sentence means 'but' and joins two opposite ideas into one sentence: 高いですが、おいしいです.","でも at the START of a new sentence also means 'but': 高いです。でも、おいしいです。"],"tips":["Reason から → result (reason first!).","が after です/ます = 'but'; が after a noun = subject marker — context tells you which."],"examples":[["雨ですから、タクシーで行きます。","あめですから、タクシーで いきます。","Ame desu kara, takushii de ikimasu.","It's raining, so I'll go by taxi.","Reason から, result"],["高いですが、とてもおいしいです。","たかいですが、とても おいしいです。","Takai desu ga, totemo oishii desu.","It's expensive, but very tasty.","A が、B = A, but B"],["時間がありませんから、急ぎましょう。","じかんが ありませんから、いそぎましょう。","Jikan ga arimasen kara, isogimashou.","We don't have time, so let's hurry.","Negative reason から"]],"more":{"雨ですから、タクシーで行きます。":[["遠いですから、バスで行きます。","とおいですから、バスで いきます。","Tooi desu kara, basu de ikimasu.","It's far, so I'll go by bus."],["暑いですから、窓を開けましょう。","あついですから、まどを あけましょう。","Atsui desu kara, mado o akemashou.","It's hot, so let's open the window."]],"高いですが、とてもおいしいです。":[["小さいですが、便利です。","ちいさいですが、べんりです。","Chiisai desu ga, benri desu.","It's small, but convenient."],["古いですが、きれいです。","ふるいですが、きれいです。","Furui desu ga, kirei desu.","It's old, but clean."]],"時間がありませんから、急ぎましょう。":[["お金がありませんから、買いません。","おかねが ありませんから、かいません。","Okane ga arimasen kara, kaimasen.","I don't have money, so I won't buy it."],["明日はテストですから、勉強します。","あしたは テストですから、べんきょう します。","Ashita wa tesuto desu kara, benkyou shimasu.","There's a test tomorrow, so I'll study."]]},"para":[[["寒いですから、窓を閉めます。","さむいですから、まどを しめます。","Samui desu kara, mado o shimemasu.","It's cold, so I'll close the window."],["お腹がすきましたから、何か食べましょう。","おなかが すきましたから、なにか たべましょう。","Onaka ga sukimashita kara, nanika tabemashou.","I'm hungry, so let's eat something."]],[["日本語は難しいですが、おもしろいです。","にほんごは むずかしいですが、おもしろいです。","Nihongo wa muzukashii desu ga, omoshiroi desu.","Japanese is difficult, but interesting."],["行きたいですが、時間がありません。","いきたいですが、じかんが ありません。","Ikitai desu ga, jikan ga arimasen.","I want to go, but I don't have time."]],[["このかばんは高いです。でも、とてもいいです。","この かばんは たかいです。でも、とても いいです。","Kono kaban wa takai desu. Demo, totemo ii desu.","This bag is expensive. But it's very good."],["雨です。でも、出かけます。","あめです。でも、でかけます。","Ame desu. Demo, dekakemasu.","It's raining. But I'll go out."]]]},{"title":"Comparisons: より・ほうが・いちばん","pattern":"A は B より + adjective     (A is more … than B)\nA と B と、どちらが …か     (Which is more …, A or B?)\nA の ほうが …               (A is more …)\nX の中で Y が いちばん …    (Of X, Y is the most …)","explanation":["より means 'than' and comes after the thing being compared against: 東京はヘルシンキより大きいです (Tokyo is bigger than Helsinki). Japanese adjectives don't change — there's no 'bigger' form.","To ask which of two, use どちら: 夏と冬と、どちらが好きですか. Answer with ～のほうが: 冬のほうが好きです (I like winter better).","For 'the most' among three or more, use の中で … いちばん: 果物の中で、りんごがいちばん好きです."],"tips":["The adjective stays the same: 大きい = big / bigger / biggest depending on より, ほうが, いちばん.","Use どちら for two things, 何/だれ/どこ が いちばん for three or more."],"examples":[["東京はヘルシンキより大きいです。","とうきょうは ヘルシンキより おおきいです。","Toukyou wa Herushinki yori ookii desu.","Tokyo is bigger than Helsinki.","A は B より"],["夏と冬と、どちらが好きですか。","なつと ふゆと、どちらが すきですか。","Natsu to fuyu to, dochira ga suki desu ka?","Which do you like better, summer or winter?","Choosing between two"],["冬のほうが好きです。","ふゆの ほうが すきです。","Fuyu no hou ga suki desu.","I like winter better.","A の ほうが"],["果物の中で、りんごがいちばん好きです。","くだものの なかで、りんごが いちばん すきです。","Kudamono no naka de, ringo ga ichiban suki desu.","Of all fruits, I like apples best.","の中で … いちばん"]],"more":{"東京はヘルシンキより大きいです。":[["フィンランドは日本より寒いです。","フィンランドは にほんより さむいです。","Finrando wa Nihon yori samui desu.","Finland is colder than Japan."],["電車は車より便利です。","でんしゃは くるまより べんりです。","Densha wa kuruma yori benri desu.","The train is more convenient than the car."]],"夏と冬と、どちらが好きですか。":[["犬と猫と、どちらが好きですか。","いぬと ねこと、どちらが すきですか。","Inu to neko to, dochira ga suki desu ka?","Which do you like better, dogs or cats?"],["バスと電車と、どちらが速いですか。","バスと でんしゃと、どちらが はやいですか。","Basu to densha to, dochira ga hayai desu ka?","Which is faster, the bus or the train?"]],"冬のほうが好きです。":[["猫のほうが好きです。","ねこの ほうが すきです。","Neko no hou ga suki desu.","I like cats better."],["電車のほうが速いです。","でんしゃの ほうが はやいです。","Densha no hou ga hayai desu.","The train is faster."]],"果物の中で、りんごがいちばん好きです。":[["スポーツの中で、サッカーがいちばん好きです。","スポーツの なかで、サッカーが いちばん すきです。","Supootsu no naka de, sakkaa ga ichiban suki desu.","Of all sports, I like football best."],["家族の中で、父がいちばん早く起きます。","かぞくの なかで、ちちが いちばん はやく おきます。","Kazoku no naka de, chichi ga ichiban hayaku okimasu.","In my family, my father gets up the earliest."]]},"para":[[["新幹線はバスより速いです。","しんかんせんは バスより はやいです。","Shinkansen wa basu yori hayai desu.","The bullet train is faster than the bus."],["今日は昨日より寒いです。","きょうは きのうより さむいです。","Kyou wa kinou yori samui desu.","Today is colder than yesterday."]],[["コーヒーと紅茶と、どちらが好きですか。","コーヒーと こうちゃと、どちらが すきですか。","Koohii to koucha to, dochira ga suki desu ka?","Which do you like better, coffee or tea?"],["コーヒーのほうが好きです。","コーヒーの ほうが すきです。","Koohii no hou ga suki desu.","I like coffee better."]],[["一年の中で、夏がいちばん好きです。","いちねんの なかで、なつが いちばん すきです。","Ichinen no naka de, natsu ga ichiban suki desu.","Of the whole year, I like summer best."],["クラスの中で、だれがいちばん背が高いですか。","クラスの なかで、だれが いちばん せが たかいですか。","Kurasu no naka de, dare ga ichiban se ga takai desu ka?","Who is the tallest in the class?"]]]},{"title":"Dictionary form + こと: can do / hobbies","pattern":"Verb dictionary form + ことが できます   (can do …)\nVerb dictionary form + ことです           (… is doing …)","explanation":["The dictionary (plain) form is the basic form of a verb found in dictionaries: 話す, 食べる, 行く, する. Adding こと turns the action into a noun: 話すこと = 'speaking'.","～ことができます means 'can do': 日本語を話すことができます (I can speak Japanese). できます is the polite form of できる (be able).","～ことです lets you say what something IS: 趣味は写真を撮ることです (My hobby is taking photos)."],"tips":["The verb before こと is always dictionary form: 話しますこと ✗.","For nouns use が できます directly: 日本語ができます (I can do Japanese)."],"examples":[["日本語を話すことができます。","にほんごを はなす ことが できます。","Nihongo o hanasu koto ga dekimasu.","I can speak Japanese.","Dictionary form + ことができます"],["ピアノを弾くことができますか。","ピアノを ひく ことが できますか。","Piano o hiku koto ga dekimasu ka?","Can you play the piano?","Asking about ability"],["趣味は写真を撮ることです。","しゅみは しゃしんを とる ことです。","Shumi wa shashin o toru koto desu.","My hobby is taking photos.","～ことです"]],"more":{"日本語を話すことができます。":[["車を運転することができます。","くるまを うんてん する ことが できます。","Kuruma o unten suru koto ga dekimasu.","I can drive a car."],["ギターを弾くことができます。","ギターを ひく ことが できます。","Gitaa o hiku koto ga dekimasu.","I can play the guitar."]],"ピアノを弾くことができますか。":[["泳ぐことができますか。","およぐ ことが できますか。","Oyogu koto ga dekimasu ka?","Can you swim?"],["漢字を書くことができますか。","かんじを かく ことが できますか。","Kanji o kaku koto ga dekimasu ka?","Can you write kanji?"]],"趣味は写真を撮ることです。":[["趣味は本を読むことです。","しゅみは ほんを よむ ことです。","Shumi wa hon o yomu koto desu.","My hobby is reading books."],["趣味は料理をすることです。","しゅみは りょうりを する ことです。","Shumi wa ryouri o suru koto desu.","My hobby is cooking."]]},"para":[[["私の夢は日本に住むことです。","わたしの ゆめは にほんに すむ ことです。","Watashi no yume wa Nihon ni sumu koto desu.","My dream is to live in Japan."],["料理をすることが好きです。","りょうりを する ことが すきです。","Ryouri o suru koto ga suki desu.","I like cooking."]],[["漢字を読むことができます。","かんじを よむ ことが できます。","Kanji o yomu koto ga dekimasu.","I can read kanji."],["ここで泳ぐことができますか。","ここで およぐ ことが できますか。","Koko de oyogu koto ga dekimasu ka?","Can you swim here?"]],[["趣味は音楽を聞くことです。","しゅみは おんがくを きく ことです。","Shumi wa ongaku o kiku koto desu.","My hobby is listening to music."],["仕事は日本語を教えることです。","しごとは にほんごを おしえる ことです。","Shigoto wa nihongo o oshieru koto desu.","My job is teaching Japanese."]]]}]]],"tests":[[{"jp":"私はパンを食べます。","kana":"わたしは パンを たべます。","romaji":"Watashi wa pan o tabemasu.","en":"I eat bread.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"私（　）パンを食べます。","answer":"は"},{"blanked":"私はパン（　）食べます。","answer":"を"}],"chunks":["私は","パンを","食べます"]},{"jp":"私は水を飲みます。","kana":"わたしは みずを のみます。","romaji":"Watashi wa mizu o nomimasu.","en":"I drink water.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"私（　）水を飲みます。","answer":"は"},{"blanked":"私は水（　）飲みます。","answer":"を"}],"chunks":["私は","水を","飲みます"]},{"jp":"父は新聞を読みます。","kana":"ちちは しんぶんを よみます。","romaji":"Chichi wa shinbun o yomimasu.","en":"My father reads the newspaper.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"父（　）新聞を読みます。","answer":"は"},{"blanked":"父は新聞（　）読みます。","answer":"を"}],"chunks":["父は","新聞を","読みます"]},{"jp":"毎朝コーヒーを飲みます。","kana":"まいあさ コーヒーを のみます。","romaji":"Maiasa koohii o nomimasu.","en":"I drink coffee every morning.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"毎朝コーヒー（　）飲みます。","answer":"を"}],"chunks":["毎朝","コーヒーを","飲みます"]},{"jp":"毎朝シャワーを浴びます。","kana":"まいあさ シャワーを あびます。","romaji":"Maiasa shawaa o abimasu.","en":"I take a shower every morning.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"毎朝シャワー（　）浴びます。","answer":"を"}],"chunks":["毎朝","シャワーを","浴びます"]},{"jp":"毎日、漢字を練習します。","kana":"まいにち、かんじを れんしゅう します。","romaji":"Mainichi, kanji o renshuu shimasu.","en":"I practise kanji every day.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"毎日、漢字（　）練習します。","answer":"を"}],"chunks":["毎日、","漢字を","練習","します"]},{"jp":"友達は日本語を勉強します。","kana":"ともだちは にほんごを べんきょう します。","romaji":"Tomodachi wa nihongo o benkyou shimasu.","en":"My friend studies Japanese.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"友達（　）日本語を勉強します。","answer":"は"},{"blanked":"友達は日本語（　）勉強します。","answer":"を"}],"chunks":["友達は","日本語を","勉強","します"]},{"jp":"兄は英語を教えます。","kana":"あには えいごを おしえます。","romaji":"Ani wa eigo o oshiemasu.","en":"My older brother teaches English.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"兄（　）英語を教えます。","answer":"は"},{"blanked":"兄は英語（　）教えます。","answer":"を"}],"chunks":["兄は","英語を","教えます"]},{"jp":"先生は漢字を書きます。","kana":"せんせいは かんじを かきます。","romaji":"Sensei wa kanji o kakimasu.","en":"The teacher writes kanji.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"先生（　）漢字を書きます。","answer":"は"},{"blanked":"先生は漢字（　）書きます。","answer":"を"}],"chunks":["先生は","漢字を","書きます"]},{"jp":"私はりんごを食べます。","kana":"わたしは りんごを たべます。","romaji":"Watashi wa ringo o tabemasu.","en":"I eat an apple.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"私（　）りんごを食べます。","answer":"は"},{"blanked":"私はりんご（　）食べます。","answer":"を"}],"chunks":["私は","りんごを","食べます"]},{"jp":"姉は音楽を聞きます。","kana":"あねは おんがくを ききます。","romaji":"Ane wa ongaku o kikimasu.","en":"My older sister listens to music.","lesson":"Word order: Subject – Object – Verb","level":0,"gaps":[{"blanked":"姉（　）音楽を聞きま
