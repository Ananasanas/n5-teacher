<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japanese Teacher N5</title>
<meta name="theme-color" content="#284b8c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N5 Teacher">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow column of study cards, a sticky top bar and a thumb-reach tab bar at the bottom. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0;
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#e9ecf3; --fg:#18202e; --muted:#5a6475; --line:#d6dbe6;
  --ai:#284b8c; --ai-soft:#dfe7f6; --ai-fg:#ffffff;
  --good:#23824a; --good-soft:#e1f2e7; --bad:#b83a2e; --bad-soft:#fbe6e3; --warm:#a85d12; --warm-soft:#fbeedd;
  --rt:#3f5f9c;
  --jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#181f2b; --surface2:#222b3a; --fg:#e8ecf3; --muted:#9aa5b8; --line:#2c3647;
  --ai:#7ea2e8; --ai-soft:#1f2c47; --ai-fg:#0f141c;
  --good:#5cc483; --good-soft:#173322; --bad:#ef7d70; --bad-soft:#3a1d1a; --warm:#f0a85a; --warm-soft:#3a2a17;
  --rt:#9fb8ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#181f2b; --surface2:#222b3a; --fg:#e8ecf3; --muted:#9aa5b8; --line:#2c3647;
  --ai:#7ea2e8; --ai-soft:#1f2c47; --ai-fg:#0f141c;
  --good:#5cc483; --good-soft:#173322; --bad:#ef7d70; --bad-soft:#3a1d1a; --warm:#f0a85a; --warm-soft:#3a2a17;
  --rt:#9fb8ea; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--jp)}
ruby rt{font-size:.5em;color:var(--rt);font-weight:500}
body.nofuri ruby rt{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--round);font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--surface2);border-radius:999px;width:38px;height:38px;font-size:20px;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ai);border-color:var(--ai);color:var(--ai-fg)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;
  max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted)}
nav.tabs button b{font-family:var(--round);font-size:21px;line-height:1.1;font-weight:700}
nav.tabs button.on{color:var(--ai)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2,.card h3{margin:0;font-family:var(--round);text-wrap:balance}
.card h2{font-size:21px}.card h3{font-size:18px}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--surface2);min-height:46px}
.btn.primary{background:var(--ai);color:var(--ai-fg)}
.btn.good{background:var(--good);color:#fff}
.btn.wide{width:100%}
.say{border:0;background:var(--ai-soft);color:var(--ai);border-radius:999px;width:40px;height:40px;flex:none;font-size:18px}
.big-jp{font-family:var(--jp);font-size:24px;line-height:2.1;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:0}
.ex .t{flex:1;min-width:0}
.ex .j{font-family:var(--jp);font-size:20px;line-height:2;overflow-wrap:anywhere}
.ex .r{color:var(--muted);font-size:14.5px}
body.noromaji .r.rom{display:none}
.ex .e{font-size:15px}
.note{background:var(--good-soft);border-radius:10px;padding:8px 10px;font-size:14.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--surface2)}
/* today */
.hello{background:var(--ai);color:var(--ai-fg);border:0}
.hello .big-jp{font-size:21px}
.hello rt{color:inherit;opacity:.8}
.hello .muted{color:inherit;opacity:.85}
.task{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;width:100%}
.task .ic{font-size:24px;width:34px;text-align:center;flex:none}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.task .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.task.done{background:var(--good-soft);border-color:transparent}
.task.done .ck{background:var(--good);border-color:var(--good)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.days span{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--muted)}
.days span.t{background:var(--warm-soft);color:var(--warm);font-weight:700}
.days span.d{background:var(--good);color:#fff}
.days span.now{outline:2px solid var(--ai);outline-offset:1px;color:var(--ai);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--surface2);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
/* talk */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{border-radius:16px;padding:10px 12px;max-width:92%;min-width:0}
.bub.t{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.bub.u{background:var(--ai);color:var(--ai-fg);align-self:flex-end;border-top-right-radius:4px;font-family:var(--jp);font-size:19px}
.bub.ok{background:var(--good-soft);align-self:stretch;font-size:15px}
.bub.no{background:var(--bad-soft);align-self:stretch;font-size:15px}
.bub.info{background:var(--warm-soft);align-self:stretch;font-size:15px}
.bub .head{display:flex;gap:8px;align-items:flex-start}
.bub .head .big-jp{flex:1;min-width:0;font-size:21px}
body.noenglish .bub .en{display:none}
.answer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.answer .in{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-family:var(--jp);font-size:18px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--fg)}
.hint{background:var(--warm-soft);border-radius:14px;padding:10px 12px}
.diff{display:flex;flex-direction:column;gap:6px;margin-top:8px;background:var(--surface);border-radius:12px;padding:8px 10px}
.dline{font-family:var(--jp);font-size:20px;letter-spacing:.02em;overflow-wrap:anywhere}
.d-ok{color:var(--fg)}.d-miss{color:var(--warm);text-decoration:underline;text-decoration-thickness:2px;font-weight:700}
.d-extra{color:var(--bad);text-decoration:line-through;font-weight:700}
/* kanji */
.sets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.kcard{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.kchar{font-family:var(--jp);font-size:76px;line-height:1;font-weight:700;grid-row:span 3}
.kmean{font-size:22px;font-weight:700;font-family:var(--round)}
.qbig{font-family:var(--jp);font-size:72px;text-align:center;font-weight:700;line-height:1.3}
.qbig.word{font-size:52px}.qbig.en{font-family:var(--round);font-size:34px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:19px;font-weight:600;min-height:54px;overflow-wrap:anywhere}
.opt.jpo{font-family:var(--jp);font-size:22px}
.opt.right{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
/* grammar */
.lvl{border-left:5px solid var(--c);padding-left:12px}
.lesson-btn{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;display:flex;gap:10px;align-items:center}
.lesson-btn span{flex:1;min-width:0}
.pattern{font-family:var(--jp);font-size:18px;background:var(--ai-soft);color:var(--fg);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.stk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-weight:700;color:#fff;background:var(--c);flex:none;font-size:20px}
.stk.off{background:var(--surface2);color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ai)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:15px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px #0002}
.toggles{display:flex;flex-direction:column}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:12px}
.tg:first-child{border-top:0}
.sw{width:52px;height:31px;border-radius:99px;background:var(--surface2);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:left .15s}
.sw.on{background:var(--good)}.sw.on::after{left:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
